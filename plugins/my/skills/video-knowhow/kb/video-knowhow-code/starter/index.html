<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Code-video starter</title>
<style>
  html, body { margin: 0; background: #000; color: #ccc; font: 12px Menlo, monospace; }
  canvas { display: block; width: 100vw; height: auto; max-height: 100vh; object-fit: contain; margin: 0 auto; }
  #hud { position: fixed; left: 8px; bottom: 6px; opacity: 0.6; pointer-events: none; white-space: pre; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hud"></div>
<script src="timeline.js"></script>
<script src="tokens.js"></script>
<script src="scene.js"></script>
<script>
// The stage. Its contract with render.js:
//   index.html?render[&fps=N]    render mode: the page draws nothing by itself; render.js asks for each frame
//   await window.ready           resolves once the fonts are loaded and a frame can be drawn
//   window.draw(frame, samples)  draws frame `frame` (time frame / fps) into canvas#c
// Without ?render the page previews itself with requestAnimationFrame.
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const FPS = +(Q.get('fps') || T.FPS);
const main = document.getElementById('c');
const mctx = main.getContext('2d');
const sub = document.createElement('canvas');   // scene() draws each sub-frame here
sub.width = T.W; sub.height = T.H;
const ctx = sub.getContext('2d');

// One frame: `samples` sub-frames spread over a half-frame shutter (180°) and averaged into #c, a motion blur.
// Each sub-frame depends only on its time, so frames can be drawn in any order.
window.draw = function (frame, samples = 4) {
  const t0 = T.frameToSec(frame, FPS);
  for (let i = 0; i < samples; i++) {
    ctx.save();
    scene(ctx, t0 + (i / samples) * (0.5 / FPS));
    ctx.restore();
    mctx.globalAlpha = 1 / (i + 1);              // a running mean: sub-frame i weighs 1 / (i + 1)
    mctx.drawImage(sub, 0, 0);
  }
  mctx.globalAlpha = 1;
};

const F = TOKENS.font;
window.ready = document.fonts.load(`${F.weight} ${F.size}px ${F.family}`)
  .then(() => document.fonts.ready)
  .then(() => true);

// Preview. Real time chooses the frame number; the frame number still decides the picture. With score.wav
// loaded, a click starts the sound and the picture follows the audio clock. Space pauses, R restarts.
if (!RENDER) window.ready.then(() => {
  const hud = document.getElementById('hud');
  const audio = new Audio('score.wav');
  let hasAudio = false, playing = true, clock = 0, last = performance.now();
  audio.addEventListener('canplaythrough', () => { hasAudio = true; }, { once: true });
  const start = () => { if (hasAudio && playing) { audio.currentTime = clock; audio.play().catch(() => {}); } };
  addEventListener('click', start);
  addEventListener('keydown', e => {
    if (e.code === 'Space') { playing = !playing; if (playing) start(); else audio.pause(); e.preventDefault(); }
    if (e.code === 'KeyR') { clock = 0; start(); }
  });
  const loop = now => {
    const dt = (now - last) / 1000;
    last = now;
    if (playing) clock = hasAudio && !audio.paused ? audio.currentTime : clock + dt;
    if (clock >= T.DURATION) { clock = 0; start(); }
    const frame = Math.floor(clock * FPS);
    window.draw(frame, 1);
    hud.textContent = `beat ${T.secToBeat(clock).toFixed(2)}  frame ${frame}  ` +
      (!hasAudio ? '(no score.wav)' : audio.paused ? '[click for sound]' : 'sound on');
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
