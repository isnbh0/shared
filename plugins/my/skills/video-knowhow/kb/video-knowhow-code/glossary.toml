# The package glossary: every defined term, defined once.
#
# Each [terms."Name"] table is one entry. The table key is the canonical name, so a
# second definition of the same term is a TOML parse error. Fields:
#   definition    plain English, one or two sentences
#   see           optional links, as { text, href } with href relative to video-knowhow-code/
#   retired       variant strings termcheck reports in shipped prose. A plain string matches
#                 case-insensitively as a whole phrase; a string starting "re:" is a regular
#                 expression, matched case-sensitively unless it sets its own flags.
#   retired_code  inline-code spans (exact content) that count as retired too
#   quoted_ok     true lets the retired variants stand inside double quotes (spelling rules)
#   forms         optional usage forms for termcheck's "used outside the glossary" check
#                 (default: the name without any parenthetical, singular or plural)
#
# [plain."word"] tables retire variants whose replacement is ordinary English rather than a
# defined term. They are checked by termcheck and not rendered.
#
# [allow] quoted lists the exact double-quoted strings termcheck exempts outside
# sources/excerpts/ (where all quoted source text is exempt).
#
# Rendered by video-knowhow-craft/tools/glossary.py into Glossary.md and pulled by
# video-knowhow-craft/roundup/render_static.py into the roundup's glossary tables.

