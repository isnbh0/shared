[plain."relied-on"]
retired = ["load-bearing"]

[plain."starting point"]
retired = ["Choose an entrance", "Home entrances", "five Home entrances"]

[plain."decision"]
retired = ["re:\\b[Rr]ulings?\\b"]

[plain."what was learned from SLASH_MY"]
retired = ["re:\\b[Dd]istillation\\b"]

[plain."(cut)"]
retired = ["re:\\bCVK\\b", "re:\\bspine\\b", "re:(?<!skills )(?<![\\w-])[Hh]ype(?![\\w-])(?! film)"]

[plain."run notes"]
retired = ["re:\\breadouts?\\b"]

[plain."dialogue"]
# American spelling for speech; the ATSC terms "dialog gating" and "dialog-gated" keep theirs,
# and quoted sources keep their own spelling.
