<!doctype html>
<html lang="en" data-math-timeout="15000">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js; style-src 'unsafe-inline'; font-src https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/output/chtml/fonts/; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Outline</title>
  <style>
    @layer reset, tokens, base, layout, components, states;

    @layer reset {
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; }
      .outline, .outline ul { list-style: none; margin: 0; padding: 0; }
    }

    @layer tokens {
      :root {
        /* Dynalist theme_default / theme_dark */
        --bg: light-dark(#fff, #181818);
        --fg: light-dark(#222, #eee);
        --note: light-dark(#4e4e4e, #cacaca);
        --bullet: light-dark(#7a7a7a, #a7a7a7);       /* graphics: >= 3:1 on --bg and --active */
        --label: light-dark(#6b6b6b, #a7a7a7);        /* text: Dynalist's #7a7a7a is 4.29:1 on white */
        --chrome-hover: light-dark(#4e4e4e, #cacaca);
        --guide: light-dark(#eee, #444);              /* decorative, exempt from law V */
        --active: light-dark(#cce8ff, #003766);
        --selection: light-dark(rgb(204 232 255 / 0.99), rgb(0 55 102 / 0.99));
        --code-fg: light-dark(#c7254e, #e26182);      /* dark: #c7254e is ~2.9:1 on #262626 */
        --code-bg: light-dark(#f5f5f5, #262626);
        --link-focus: #008aff;                        /* Dynalist theme-color */
        /* Spacing panel: a raised surface, retuned per scheme rather than inverted. Light: white
           card, hairline border, soft shadow. Dark: a surface lighter than the page, since a
           shadow barely reads on #181818, with a border that separates it from the page. */
        --panel-bg: light-dark(#fff, #242424);
        --panel-border: light-dark(#ddd, #3d3d3d);
        --panel-shadow: light-dark(rgb(0 0 0 / 0.12), rgb(0 0 0 / 0.6));
        /* Find: Dynalist's match yellow; its dark #74740e is 3.02:1 under notes, so the lightest
           olive step that keeps --note >= 4.5:1. The box border is Dynalist's. */
        --match: light-dark(#ffff99, #58580b);
        --find-border: light-dark(#ccc, #444);

        /* Reader knobs. The Spacing panel sets only these five, as inline style on :root. Line
           height is a ratio and the note size follows the text size, so size and leading stay
           coupled. Dynalist large / cozy is 20/24 with a 32px pitch; these defaults are looser. */
        --font-size: 20px;
        --lh: 1.5;
        --item-gap: 10px;     /* space between consecutive rows */
        --indent: 30px;       /* per level: a child's row starts under its parent's text */
        --column: 820px;

        --line: calc(var(--font-size) * var(--lh));             /* 30px */
        --note-size: calc(var(--font-size) - 3px);              /* 17px */
        --note-line: calc(var(--note-size) * var(--lh));        /* 25.5px */
        --note-gap: 0px;      /* Dynalist: a note's line box starts where its item's first line ends */
        --title-size: 28px;
        --title-line: 34px;
        --title-inset: 6px;   /* the root row's highlight is flush with the rows'; its text clears the ring */
        --bullet-col: 22px;
        --text-gap: 4px;      /* Dynalist: 15px from the bullet center (11px in) to the text; a child
                                 starts --indent - 26px right of its parent's text (4px by default) */
        --column-pad-start: 88px;   /* Dynalist: the title's text starts 88px into the column */
        --column-pad-end: 34px;     /* Dynalist: the page tools end 34px before the column's edge */
        --group-gap: 4px;     /* Dynalist: extra space after each nested group of children closes */

        --page-pad: 16px;     /* narrow viewports: the page's inline padding */
        --hit: 24px;          /* the smallest target (WCAG 2.5.8); 44px under a coarse pointer */

        --font-ui: "Whitney", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --font-mono: Consolas, ui-monospace, SFMono-Regular, Menlo, Courier, monospace;
      }
      /* A finger: 44px targets (WCAG 2.5.5), rows 44px apart, and room for the bullet's slop at
         the page's edge. The Spacing panel's item-gap default follows (SPACING in the script). */
      @media (any-pointer: coarse) {
        :root { --item-gap: 14px; --hit: 44px; --page-pad: 20px; }
      }
    }

    @layer base {
      html {
        background: var(--bg);
        color: var(--fg);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;   /* :active and :focus-visible styles instead */
        scroll-padding-block-start: var(--head-block, 0px);   /* the sticky header's height */
      }
      /* No double-tap zoom delay on controls; pinch zoom stays everywhere. */
      button, input, a, .toggle { touch-action: manipulation; }
      body {
        font: 16px/1.25 var(--font-ui);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      ::selection { background: var(--selection); }
      strong { font-weight: 700; }
      em { font-style: italic; }
    }

    @layer layout {
      main, .page-head {
        max-inline-size: var(--column);   /* border-box: includes the padding */
        margin-inline: auto;
        padding-inline: var(--column-pad-start) var(--column-pad-end);
      }
      /* The header holds the breadcrumbs (when zoomed), the find box and the page tools above the
         title: the title is the tree's root item, so it spans the whole column. The box and the
         tools sit at the end. The crumbs take the rest of the row while it leaves them 12rem, and
         otherwise a row of their own below it (the container query), so they never collapse. The
         header keeps its height at every column width while the crumbs are hidden (the column knob
         never moves the title). */
      .page-head {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        flex-wrap: wrap;
        row-gap: 8px;
        column-gap: 16px;
        container-type: inline-size;
        /* Dynalist's icon row and title; the tools end on the column's edge, like its icons. */
        padding-block-start: 25px;
        padding-inline-end: 8px;
        margin-block-end: 9.5px;
      }
      /* Zoomed, Dynalist's header row sits 13px lower and the title 13px lower; its crumbs
         start 11px before the title and sit slightly below the row's center. */
      .page-head:has(> #crumbs:not([hidden])) { padding-block-start: 38px; margin-block-end: 9px; }
      #crumbs { position: relative; inset-block-start: 1.5px; margin-inline-start: -11px; }
      .find { order: 1; }
      .page-tools { order: 2; display: flex; flex: none; gap: 16px; }
      #crumbs { display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-inline-size: 12rem; }
      /* One line that scrolls sideways (renderCrumbs scrolls it to the end): each crumb shrinks to
         6em and ellipsises before the line scrolls. */
      #crumbs ol {
        display: flex;
        flex: 1 1 auto;
        flex-wrap: nowrap;
        min-inline-size: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
      }
      #crumbs li { display: flex; align-items: center; min-inline-size: min(6em, max-content); flex: 0 1 auto; }
      #crumbs li::after { content: ">" / ""; flex: none; padding-inline: 9px; color: var(--label); }
      #crumbs li:last-child::after { padding-inline-end: 0; }
      #up-button { display: none; }
      @container (max-width: 42rem) {
        #crumbs { order: 3; flex-basis: 100%; min-inline-size: 0; inset-block-start: 0; margin-inline-start: 0; }
        .find { flex: 1 1 8rem; }
      }
      main { padding-block-end: max(50px, env(safe-area-inset-bottom)); container-type: inline-size; }
      #doc-title {
        margin: 0;
        font-size: var(--title-size);
        line-height: var(--title-line);
        font-weight: 400;
        overflow-wrap: anywhere;
      }
      .intro {
        margin-block-start: 5px;                /* the root's note sits 5px under the title */
        font-size: var(--note-size);
        line-height: var(--note-line);
        color: var(--note);
        overflow-wrap: anywhere;
      }
      .intro p { margin: 0; }
      .intro p + p { margin-block-start: var(--note-line); }
      .outline { font-size: var(--font-size); line-height: var(--line); }
      /* A group's 1px guide runs under its parent's bullet center (10px margin, then the border,
         whose right edge is the bullet center at 11px), and the padding makes up the rest of the
         step: 10 + 1 + (step - 11) = step. The step is the indent, capped so that the deepest level
         of the displayed tree (--depth, set by renderTree) keeps a 16ch measure in the column
         (law M3): 100cqi is #main's content width. Below an 11px step the guide moves in with it. */
      .outline ul {
        /* 16.5ch: the ch unit comes from the first available font, which can run a few percent
           narrower than the digits the system font renders. */
        /* 16.5ch: the ch unit comes from the first available font, which can run a few percent
           narrower than the digits the system font renders. */
        --measure: calc(100cqi - var(--bullet-col) - var(--text-gap) - 16.5ch);
        --step: min(var(--indent), max(2px, var(--measure) / max(1, var(--depth, 1) - 1)));
        margin-inline-start: min(calc(var(--bullet-col) / 2 - 1px), calc(var(--step) - 1px));
        padding-inline-start: max(0px, calc(var(--step) - var(--bullet-col) / 2));
        border-inline-start: 1px solid var(--guide);
      }
      /* Dynalist leaves --group-gap after each nested group closes. The margin sits outside the
         group's border, so its guide ends at its last descendant, but inside its item, which is a
         block formatting context: the gap belongs to the item (a range fill covers it), two groups
         closing together leave 2 * --group-gap, and the outer guide runs past the inner one by
         --group-gap, as Dynalist's does. A guide starts at its parent's text, not its row: the
         group rises into the row's bottom padding. */
      .outline [role="treeitem"] { display: flow-root; }
      .outline [role="group"] {
        margin-block: calc(var(--item-gap) / -2) var(--group-gap);
        padding-block-start: calc(var(--item-gap) / 2);
      }
      /* The root's children are the top level: no indent and no guide. */
      #item-root > [role="group"] { margin: 0; padding: 0; border: 0; }
      /* The label gutter grows with the longest label (--label-chars, set by renderTree): monospace
         advances are at most 0.62em, and the label ends 8px left of the outline. */
      main, .page-head {
        padding-inline-start: max(var(--column-pad-start), calc(var(--label-chars, 0) * 0.62 * 12px + 8px));
      }
      /* Narrow viewports (WCAG 1.4.10 reflow at 320px): the column knob is ignored, and the indent
         scales down (16px at the default 30px), still capped by the measure. */
      @media (max-width: 40rem) {
        main, .page-head {
          padding-inline: max(var(--page-pad), env(safe-area-inset-left)) max(var(--page-pad), env(safe-area-inset-right));
          max-inline-size: none;
        }
        .outline ul { --step: min(var(--indent) * 16 / 30, max(2px, var(--measure) / max(1, var(--depth, 1) - 1))); }
      }
      /* Phones and tablets: a compact header that stays on screen (find, the ⋯ menu and Up are
         always in reach), except where the viewport is too short to spare it. */
      @media (max-width: 40rem), (hover: none) {
        .page-head, .page-head:has(> #crumbs:not([hidden])) {
          position: sticky;
          inset-block-start: 0;
          z-index: 2;
          background: var(--bg);
          padding-block: max(8px, env(safe-area-inset-top)) 8px;
          margin-block-end: 9.5px;
          border-block-end: 1px solid var(--guide);
        }
        .page-tools { gap: 4px; }
        #crumbs { inset-block-start: 0; margin-inline-start: 0; }
        #up-button { display: inline-flex; }
      }
      @media (max-height: 25rem) {
        .page-head, .page-head:has(> #crumbs:not([hidden])) { position: static; }
      }
    }

    @layer components {
      /* Bullet, label and text share the first line's baseline (law M2): the toggle's line box
         has the same strut as the text's first line, so a taller first line (typeset math) moves
         the bullet down with its baseline instead of overprinting it. */
      .row {
        display: flex;
        align-items: baseline;
        gap: var(--text-gap);
        /* Dynalist's highlight reaches a whole gap above the text and half a gap below, so a row
           rises half a gap into the one before it; the pitch stays line + gap. */
        padding-block: var(--item-gap) calc(var(--item-gap) / 2);
        margin-block-start: calc(var(--item-gap) / -2);
      }
      .text { flex: 1 1 auto; min-inline-size: 0; overflow-wrap: anywhere; }
      .para { display: block; }
      /* The root row: title and intro, no bullet. It starts --title-inset before the item rows, so
         the title's text lines up with the column's start while its highlight keeps room for the
         focus ring. The 10px below it matches Dynalist's gap from the title to the first item. */
      .row.root-row {
        display: block;
        padding-inline: var(--title-inset);
        margin-inline-start: calc(-1 * var(--title-inset));
        margin-block: 0 10px;
        padding-block: calc(var(--item-gap) / 2);
      }
      .para + .para {                           /* Dynalist note */
        font-size: var(--note-size);
        line-height: var(--note-line);
        color: var(--note);
        margin: var(--note-gap) 0 0;
      }
      /* Number labels sit in a gutter left of the outline, on the first line's baseline. The label
         is the first thing in the item's first paragraph (so it is read first, as part of the
         item's name), inside a zero-size .gutter whose strut puts its line's baseline on the
         text's. The label's containing block is #outline (no element between them is positioned),
         so its right edge is 8px left of the outline at every depth. */
      .outline { position: relative; }
      .gutter {
        display: inline-block;
        inline-size: 0;
        block-size: 0;
        font: 12px/var(--line) var(--font-mono);
        white-space: nowrap;
      }
      .gutter::before { content: ""; display: inline-block; }
      .label {
        position: absolute;
        inset-inline-end: calc(100% + 8px);
        font: inherit;
        font-variant-numeric: tabular-nums;
        color: var(--label);
      }
      /* Narrow viewports: the label is an inline prefix of the text that wraps with it, so it never
         takes the measure from the text. */
      @media (max-width: 40rem) {
        .gutter { display: contents; line-height: 1; white-space: normal; }   /* the space after the label breaks */
        .gutter::before { content: none; }
        .label { position: static; line-height: 1; white-space: nowrap; }
      }
      /* The bullet is the toggle, a --bullet-col x --line box whose glyph center is on the first
         line's center, 11px in. Its hit area reaches over the gap to the text and, under a coarse
         pointer, --slop-s before it and --slop-b above and below (44px at the default spacing);
         the negative margins keep the layout where the glyph box alone would put it. ::before is
         in flow (it gives the toggle the line box that sets its baseline); ::after is the ring. */
      .toggle {
        --slop-s: 0px;
        --slop-b: 0px;
        flex: none;
        position: relative;
        box-sizing: content-box;
        inline-size: var(--bullet-col);
        block-size: var(--line);
        padding: var(--slop-b) var(--text-gap) var(--slop-b) var(--slop-s);
        margin: calc(-1 * var(--slop-b)) calc(-1 * var(--text-gap)) calc(-1 * var(--slop-b)) calc(-1 * var(--slop-s));
        user-select: none;
        -webkit-user-select: none;
      }
      @media (any-pointer: coarse) {
        .toggle {
          --slop-s: 18px;
          --slop-b: max(0px, min(44px - var(--line), var(--item-gap)) / 2);
          z-index: 1;   /* the slop reaches under a wide gutter's label: the bullet wins the tap */
        }
      }
      .toggle::before,
      .toggle::after {
        content: "";
        box-sizing: border-box;
        translate: -50% -50%;
      }
      /* leaf or expanded: 6.4px disc */
      .toggle::before {
        display: inline-block;
        vertical-align: top;
        position: relative;
        left: calc(var(--bullet-col) / 2);
        top: calc(var(--line) / 2);
        inline-size: 6.4px;
        block-size: 6.4px;
        border-radius: 50%;
        background: var(--bullet);
      }
      .toggle::after {
        display: none;
        position: absolute;
        left: calc(var(--slop-s) + var(--bullet-col) / 2);
        top: calc(var(--slop-b) + var(--line) / 2);
      }
      /* collapsed parent: 6px dot inside a 12px ring (1.5px stroke, 1.5px gap). The stroke is an
         inset shadow: Chromium floors border widths to whole CSS pixels, so a 1.5px border paints 1px. */
      [aria-expanded="false"] > .row > .toggle::before { inline-size: 6px; block-size: 6px; }
      [aria-expanded="false"] > .row > .toggle::after {
        display: block;
        inline-size: 12px;
        block-size: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px var(--bullet);
      }
      @media (hover: hover) {
        /* expanded parent: minus */
        [aria-expanded] > .row:hover > .toggle::before {
          inline-size: 11px;
          block-size: 1.5px;
          border-radius: 0;
        }
        /* collapsed parent: plus */
        [aria-expanded="false"] > .row:hover > .toggle::before { inline-size: 10.5px; }
        [aria-expanded="false"] > .row:hover > .toggle::after {
          inline-size: 1.5px;
          block-size: 10.5px;
          box-shadow: none;
          border-radius: 0;
          background: var(--bullet);
        }
      }
      code, .math:not([data-math="typeset"]) {
        font-family: var(--font-mono);
        font-size: calc(var(--font-size) - 2px);
        line-height: 1;                       /* the mono box must not grow the --line line box */
        padding: 0 5px;
        border-radius: 4px;
        background: var(--code-bg);
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      code { color: var(--code-fg); }
      .math:not([data-math="typeset"]) { color: var(--fg); }
      .para + .para code,
      .para + .para .math:not([data-math="typeset"]) { font-size: calc(var(--note-size) - 2px); }
      .intro code,
      .intro .math:not([data-math="typeset"]) { font-size: calc(var(--note-size) - 2px); }
      .row mjx-container { font-size: 1em; }
      /* Math wider than its line scrolls sideways inside its own box (law M1). layoutMath marks
         it: an inline-block that scrolls has no text baseline in every engine, so it is top-aligned. */
      .math.wide {
        display: inline-block;
        max-inline-size: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        vertical-align: top;
        overscroll-behavior-x: contain;
        padding-block: 2px;
      }
      /* MathJax's clipped copy for screen readers is as wide as its MathML, which can be wider
         than the typeset math: at 1px it no longer widens the page. (A layered !important beats
         MathJax's unlayered one.) */
      .math mjx-assistive-mml { width: 1px !important; }
      .text a, .intro a, #doc-title a { color: inherit; text-decoration: underline; }
      .help-button, .panel-button, form[method="dialog"] button, .menu button {
        flex: none;
        border: 0;
        background: none;
        padding: 4px 0;
        font: 14px/20px var(--font-ui);
        color: var(--label);
        cursor: pointer;
      }
      .panel-button { padding: 2px 0; min-inline-size: 24px; }       /* 24px tall */
      #actions-button { min-inline-size: var(--hit); font-size: 18px; }
      #up-button { gap: 4px; align-items: center; }
      @media (hover: hover) {
        .help-button:hover, .panel-button:hover, form[method="dialog"] button:hover {
          color: var(--chrome-hover);
          text-decoration: underline;
        }
        #crumbs a:hover { text-decoration: underline; }
        .menu button:not(:disabled):hover { background: var(--active); }
      }
      .help-button:focus-visible, .panel-button:focus-visible, form[method="dialog"] button:focus-visible,
      .menu button:focus-visible, #spacing input:focus-visible {
        outline: 2px solid var(--link-focus);
        outline-offset: 2px;
      }
      .menu button:focus-visible { outline-offset: -2px; }
      /* Crumbs: plain text in the text color; the ellipsis sits on the link, so the ">" before
         it is never clipped. */
      #crumbs a {
        min-inline-size: min(var(--hit), 100%);
        max-inline-size: 16em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 16px/24px var(--font-ui);
        color: var(--fg);
        text-decoration: none;
      }
      #crumbs a:focus-visible { text-decoration: underline; outline: 2px solid var(--link-focus); outline-offset: -2px; }
      @media (max-width: 40rem) {
        #crumbs a { max-inline-size: 12em; }
      }
      /* Find: Dynalist's box (18px text, 30px tall, 300px wide, radius 5), with the label color
         for its text and placeholder (law V: Dynalist's lighter gray is 4.29:1 on white). */
      .find { display: flex; align-items: center; min-inline-size: 0; }
      .find input {
        font: inherit;
        font-size: 18px;
        block-size: 30px;
        inline-size: 300px;
        min-inline-size: 0;
        border: 1px solid var(--find-border);
        border-radius: 5px;
        background: var(--bg);
        color: var(--label);
        padding-inline: 8px;
      }
      .find input:focus-visible { outline: 2px solid var(--link-focus); outline-offset: 1px; }
      .find input::placeholder { color: var(--label); opacity: 1; }
      /* The count sits before the box, so the box stays put at the header's end as the count
         appears and changes; on a narrow header the box starts the line and the count follows. */
      .find-count {
        order: -1;
        color: var(--label);
        font-size: 15px;
        margin-inline-end: 8px;
        white-space: nowrap;
        flex: none;
      }
      .find-count:empty { margin-inline-end: 0; }
      ::highlight(find) { background-color: var(--match); color: var(--fg); }
      /* A narrow header shares one row between the box and the tools: the count sits inside the
         box's end, over room the box keeps free for it. */
      @container (max-width: 42rem) {
        .find { position: relative; max-inline-size: 300px; }
        .find input { inline-size: 100%; }
        .find:has(.find-count:not(:empty)) input { padding-inline-end: 6.5em; }
        .find-count {
          position: absolute;
          inset-inline-end: 8px;
          margin: 0;
          font-size: 13px;
          pointer-events: none;
        }
      }
      /* Coarse pointers: every control is a 44px target (law M4). */
      @media (any-pointer: coarse) {
        .help-button, .panel-button, form[method="dialog"] button {
          min-block-size: 44px;
          min-inline-size: 44px;
          padding: 4px 8px;
        }
        #actions-button { font-size: 22px; }
        #crumbs a { line-height: 44px; }
        .find input { block-size: 44px; }
      }
      dialog {
        max-inline-size: min(40rem, 90vw);
        border: 0;
        border-radius: 6px;
        padding: 20px 24px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/20px var(--font-ui);
        box-shadow: 0 5px 20px rgb(0 0 0 / 0.25);
      }
      dialog::backdrop { background: rgb(0 0 0 / 0.4); }
      dialog h2 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 400; }
      .panel-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .panel-head form { margin: 0; }
      .vh {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /* Help: the Close button is first, so the dialog opens at its top; the section for the
         pointer in hand comes first. */
      #help { max-block-size: calc(100svh - 32px); }
      #help .help-body { display: flex; flex-direction: column; gap: 16px; margin-block-start: 8px; }
      #help h3 { margin: 0 0 8px; font-size: 16px; line-height: 24px; font-weight: 600; }
      @media (hover: none) {
        #help .help-touch { order: -1; }

      dl.keys, dl.touch {

        grid-template-columns: max-content 1fr;
        gap: 0.375rem 1.25rem;
        margin: 0;
      }
      dl.keys dt { white-space: nowrap; }
      dl.keys dd, dl.touch dd { margin: 0; }
      @media (max-width: 30rem) {
        dl.keys, dl.touch { grid-template-columns: 1fr; row-gap: 0; }
        dl.keys dd, dl.touch dd { margin-block-end: 0.5rem; color: var(--note); }

      /* Sheets: the Spacing panel and the ⋯ menu. Non-modal, so the outline stays live and

      .sheet {
        position: fixed;
        margin: 0;
        z-index: 3;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 12px 16px 14px;

        box-shadow: 0 6px 24px var(--panel-shadow);

      #spacing {
        inset: 16px 16px auto auto;
        inline-size: min(16rem, calc(100vw - 32px));

      #actions {

        max-block-size: calc(100vh - var(--menu-top, 56px) - 16px);

      @media (max-width: 40rem), (any-pointer: coarse) {

          inset: auto 0 0 0;
          margin-inline: auto;
          inline-size: min(100%, 32rem);
          max-inline-size: 100%;
          max-block-size: 50svh;
          border-block-end: 0;
          border-radius: 12px 12px 0 0;
          padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
          padding-block-end: max(14px, env(safe-area-inset-bottom));

      #spacing h2 { margin: 0; font-size: 16px; line-height: 24px; }
      #spacing .panel-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;

      #spacing .knobs { display: grid; gap: 10px; margin-block: 10px 8px; }
      #spacing .knob {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        column-gap: 8px;
      }
      #spacing output { color: var(--note); font-variant-numeric: tabular-nums; }
      #spacing input[type="range"] {
        grid-column: 1 / -1;

        margin: 0;
        accent-color: var(--link-focus);

      #spacing .step { display: none; }
      /* In a sheet, each slider has − and + steps beside it (a thumb is hard to nudge by one). */
      @media (max-width: 40rem), (any-pointer: coarse) {

        #spacing .knob label { grid-column: 1 / 3; }

      @media (max-width: 40rem) {

      #spacing .spacing-note { margin: 0; color: var(--label); font-size: 13px; text-align: end; }
      #spacing .spacing-ref { margin: 0 0 12px; color: var(--label); font-size: 13px; line-height: 18px; }
      #spacing .status { margin: 6px 0 0; min-block-size: 20px; }
      #spacing .status:empty { display: block; }      /* stays in the accessibility tree as a live region */

      /* The ⋯ menu: what the keyboard commands do, for the selected item (or the page). */
      .menu-target {
        margin: 0;
        padding: 6px 16px 8px;
        color: var(--note);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-block-end: 1px solid var(--guide);

      .menu { display: flex; flex-direction: column; padding-block: 4px; }
      .menu button {
        display: block;
        inline-size: 100%;
        min-block-size: var(--hit);
        padding: 6px 16px;
        text-align: start;
        font-size: 15px;
        color: var(--fg);
      }
      .menu button:disabled { color: var(--label); cursor: default; }
      .menu .level {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-inline: 16px 8px;
        font-size: 15px;
      }
      .menu .level > span:first-child { flex: 1 1 auto; }
      .menu .level output { min-inline-size: 1.5em; text-align: center; font-variant-numeric: tabular-nums; }
      .menu .level button { inline-size: auto; min-inline-size: var(--hit); padding: 0; text-align: center; font-size: 20px; }
      .menu hr { inline-size: 100%; margin: 4px 0; border: 0; border-block-start: 1px solid var(--guide); }
      @media (any-pointer: coarse) {

      .toast {
        position: fixed;
        inset-block-end: max(24px, calc(env(safe-area-inset-bottom) + 12px));
        inset-inline-start: 50%;
        z-index: 4;
        translate: -50% 0;
        margin: 0;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 15px;
        background: var(--fg);
        color: var(--bg);
        pointer-events: none;
      }
      @media (forced-colors: active) {
        .toast { border: 1px solid CanvasText; }
      }
    }

    @layer states {
      [hidden] { display: none !important; }
      [role="treeitem"]:focus { outline: none; }
      /* The highlight follows the state (law D), not focus: selected rows, none in idle mode. */
      [role="treeitem"][aria-selected="true"] > .row { background: var(--active); }
      /* A range selects whole subtrees: fill the item's box, indent and guides included, so the
         subtree reads as one block. A single selection leaves its children unselected, so only
         its row is filled. */
      [role="treeitem"][aria-selected="true"]:has(> [role="group"] > [aria-selected="true"]) { background: var(--active); }

      [role="treeitem"][aria-selected="true"]:has(> [role="group"] > [aria-selected="true"]) [role="group"] {
        border-inline-start-color: transparent;
      }

      #outline[data-mode="selected"] [role="treeitem"]:focus > .row {

        .toggle::before { background: CanvasText; forced-color-adjust: none; }

        }

      }
