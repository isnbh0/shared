      intro.replaceChildren(...paras.map((p) => {
        const para = h("p");
        para.append(renderInline(parseInline(p), model.byId, { inTree: true }));   // the displayed root's note
        return para;
      }));
      intro.hidden = paras.length === 0;
      const root = document.getElementById("item-root");
      if (paras.length > 0) root.setAttribute("aria-describedby", "intro");
      else root.removeAttribute("aria-describedby");
    }

    // ── commands ─────────────────────────────────────────
    /** @typedef {{ expanded?: Iterable<string>, activeId?: string }} Proposal */

    /** Proposal for moving `by` steps through the visible items; null at the ends. */
    function step(model, state, by) {
      const ids = visibleIds(model, state);
      const target = ids[ids.indexOf(state.activeId) + by];
      return target === undefined ? null : { activeId: target };
    }

    /** Shift+↑/↓: move the focus end one sibling; past the first or last sibling, the range
     *  becomes the parent (which holds them all) and later steps run among its siblings. */
    function extend(model, state, by) {
      if (state.activeId === state.zoomId) return null;   // the displayed root's siblings are outside
      const sibs = siblingsOf(model, state.activeId);
      const target = sibs[sibs.findIndex((n) => n.id === state.activeId) + by];
      if (target !== undefined) return { activeId: target.id, anchorId: state.anchorId };
      const parent = parentOf(model, state.activeId);
      return parent === null ? null : { activeId: parent, anchorId: parent };
    }

    function extendToEnd(model, state, end) {
      if (state.activeId === state.zoomId) return null;
      const sibs = siblingsOf(model, state.activeId);
      const target = end < 0 ? sibs[0] : sibs[sibs.length - 1];
      return target === undefined || target.id === state.activeId ? null : { activeId: target.id, anchorId: state.anchorId };
    }

    /** Shift+click: a range from the anchor to `id`, at the deepest level holding both; when one
     *  contains the other, the container alone. */
    function selectTo(model, state, id) {
      const from = [state.anchorId, ...ancestorsOf(model, state.anchorId)];
      const to = [id, ...ancestorsOf(model, id)];
      if (from.includes(id)) return { activeId: id };
      if (to.includes(state.anchorId)) return { activeId: state.anchorId };
      for (const a of from) {
        const t = to.find((x) => parentOf(model, x) === parentOf(model, a));
        if (t !== undefined) return { activeId: t, anchorId: a };
      }
      return { activeId: id };
    }

    /** Whether any child of the displayed root is expanded: its stand-in for its own expansion. */
    const topLevelOpen = (model, state) => childrenOf(model, state.zoomId).some((n) => state.expanded.has(n.id));

    /** ⌥⌘↑/↓: the nearest sibling in that direction; while filtering, the nearest shown one. */
    function stepSibling(model, state, by) {
      if (state.activeId === state.zoomId) return null;
      const sibs = siblingsOf(model, state.activeId);
      for (let i = sibs.findIndex((n) => n.id === state.activeId) + by; i >= 0 && i < sibs.length; i += by) {
        if (state.filter === null || state.filter.shown.has(sibs[i].id)) return { activeId: sibs[i].id };
      }
      return null;
    }

    /** Expansion and range commands do nothing while a query filters: openness is derived from
     *  the matches, and a change to `expanded` would surface only when the filter clears. */
    const unfiltered = (command) => (model, state, arg) => (state.filter !== null ? null : command(model, state, arg));

    /** Pure `(model, state, arg) => Proposal | null`; `arg` is the matched chord's, if any.
     *  Commands never touch the DOM or keep laws. */
    const COMMANDS = {
      next: (model, state) => step(model, state, 1),
      prev: (model, state) => step(model, state, -1),
      first: (model, state) => {
        const ids = visibleIds(model, state);
        return ids.length === 0 ? null : { activeId: ids[0] };
      },
      last: (model, state) => {
        const ids = visibleIds(model, state);
        return ids.length === 0 ? null : { activeId: ids[ids.length - 1] };
      },
      right: (model, state) => {
        const { expanded, activeId } = state;
        if (activeId === null || !hasChildren(model, activeId)) return null;
        if (state.filter !== null) {
          // While filtering: the first shown child, or nothing.
          const child = childrenOf(model, activeId).find((n) => state.filter.shown.has(n.id));
          return child === undefined ? null : { activeId: child.id };
        }
        if (!isOpen(state, activeId)) return { expanded: [...expanded.ids, activeId] };
        return { activeId: childrenOf(model, activeId)[0].id };
      },
      left: (model, { expanded, activeId, zoomId, filter }) => {
        if (activeId === null || activeId === zoomId) return null;   // the displayed root never collapses
        if (filter === null && expanded.has(activeId)) return { expanded: expanded.ids.filter((id) => id !== activeId) };
        const parent = parentOf(model, activeId);
        return parent === null ? null : { activeId: parent };
      },
      toggle: unfiltered((model, state) => {
        const { expanded, activeId } = state;
        if (activeId === null || !hasChildren(model, activeId)) return null;
        if (activeId === state.zoomId) {
          // The displayed root stays open; its children open or close one level instead.
          const parents = childrenOf(model, activeId).filter((n) => n.children.length > 0).map((n) => n.id);
          if (parents.length === 0) return null;
          if (topLevelOpen(model, state)) return { expanded: expanded.ids.filter((id) => !parents.includes(id)) };
          return { expanded: [...expanded.ids, ...parents] };
        }
        return { expanded: flip(expanded, activeId) };
      }),
      toggleSubtree: unfiltered((model, state) => {
        const { expanded, activeId } = state;
        if (activeId === null || !hasChildren(model, activeId)) return null;
        // The displayed root counts as expanded while any of its children is: then everything
        // below it closes. Its own entry (a zoomed item's expansion in the document) is kept.
        const onRoot = activeId === state.zoomId;
        const subtree = new Set([...(onRoot ? [] : [activeId]), ...descendantIds(model, activeId)]);
        const open = onRoot ? topLevelOpen(model, state) : expanded.has(activeId);
        if (open) return { expanded: expanded.ids.filter((id) => !subtree.has(id)) };
        return { expanded: [...expanded.ids, ...subtree] };
      }),
      expandSiblings: unfiltered((model, { expanded, activeId, zoomId }) => {
        if (activeId === null) return null;
        // The displayed root has no siblings on the page: on it, its children expand.
        const ids = activeId === zoomId ? childrenOf(model, zoomId) : siblingsOf(model, activeId);
        return { expanded: [...expanded.ids, ...ids.map((n) => n.id)] };
      }),
      prevSibling: (model, state) => stepSibling(model, state, -1),
      nextSibling: (model, state) => stepSibling(model, state, 1),
      extendUp: unfiltered((model, state) => extend(model, state, -1)),
      extendDown: unfiltered((model, state) => extend(model, state, 1)),
      extendFirst: unfiltered((model, state) => extendToEnd(model, state, -1)),
      extendLast: unfiltered((model, state) => extendToEnd(model, state, 1)),
      // The filter clears first, then a range collapses, then the selection goes idle.
      escape: (model, state) => (state.filter !== null ? { query: "" } : isRange(state) ? {} : { mode: "idle" }),
      /** Enter while filtering: keep the selected item, shown in place, and clear the filter. */
      accept: (model, state) =>
        state.filter === null || state.activeId === null ? null : { ...reveal(model, state, state.activeId), query: "" },
      /** Dynalist's "expand to level": below the active item, items fewer than n levels down are
       *  expanded and deeper ones collapsed; outside its subtree nothing changes. The displayed
       *  root is always open, so only its descendants change. */
      expandLevel: unfiltered((model, state, n) => {
        const { expanded, activeId } = state;
        if (activeId === null || !hasChildren(model, activeId) || !(n >= 1 && n <= 9)) return null;
        const below = new Set(descendantIds(model, activeId));
        const open = activeId === state.zoomId ? [] : [activeId];
        const walk = (nodes, depth) => {
          if (depth >= n) return;
          for (const node of nodes) {
            if (node.children.length === 0) continue;
            open.push(node.id);
            walk(node.children, depth + 1);
          }
        };
        walk(childrenOf(model, activeId), 1);
        return { expanded: [...expanded.ids.filter((id) => !below.has(id)), ...open] };
      }),
    };

    // ── keymap ───────────────────────────────────────────
    // userAgentData.platform is "macOS" (lowercase m), navigator.platform is "MacIntel": match case-insensitively.
    const IS_APPLE = /mac|iphone|ipad/i.test(navigator.userAgentData?.platform ?? navigator.platform);

    /** The single source of truth for key bindings and the help dialog.
     *  chord fields: key (KeyboardEvent.key) or code (KeyboardEvent.code);
     *  mod/alt/shift: true | false (default false) | "any"; arg: passed to the command.
     *  label: shown in help as one key instead of every chord. */
    const MULTI = "Touch selects one item at a time: a range needs a keyboard (Shift) or a mouse (Shift+click)";
    /** The single source of truth for key bindings, touch gestures, the ⋯ menu and the help dialog.
     *  chord fields: key (KeyboardEvent.key) or code (KeyboardEvent.code);
     *  mod/alt/shift: true | false (default false) | "any"; arg: passed to the command.
     *  label: shown in help as one key instead of every chord.
     *  touch: the gesture that does it on a touch screen, or false with a `reason` (multi-select
     *  only); touchHelp: its help text when it differs from `help`.
     *  menu: its item in the ⋯ menu (the name in help); menuLabel: (state, target) => the item's
     *  text for the menu's target, when it depends on it. */
    const KEYMAP = [
      { command: "prev",           chords: [{ key: "ArrowUp" }],                 help: "Previous item",
        touch: "Tap an item", touchHelp: "Select it" },
      { command: "next",           chords: [{ key: "ArrowDown" }],               help: "Next item", touch: "Tap an item" },
      { command: "right",          chords: [{ key: "ArrowRight" }],              help: "Expand, or go to first child",
        touch: "Tap a bullet", touchHelp: "Select its item and expand or collapse it" },
      { command: "left",           chords: [{ key: "ArrowLeft" }],               help: "Collapse, or go to parent", touch: "Tap a bullet" },
      { command: "first",          chords: [{ key: "Home" }],                    help: "First item: the title",
        touch: "Tap the title", touchHelp: "Select the title: ⋯ then acts on the whole page" },
      { command: "last",           chords: [{ key: "End" }],                     help: "Last item", touch: "Tap an item" },
      { command: "expandSiblings", chords: [{ key: "*", shift: "any" }],         help: "Expand all siblings; on the title, the top level",
        menu: "Expand siblings" },
      { command: "toggle",         chords: [{ code: "Period", mod: true }],      help: "Expand/collapse; on the title, the top level",
        touch: "Tap a bullet", menu: "Expand/Collapse",
        menuLabel: (s, t) => (t === s.zoomId ? (topLevelOpen(model, s) ? "Collapse top level" : "Expand top level") : isOpen(s, t) ? "Collapse" : "Expand") },
      { command: "toggleSubtree",  chords: [{ code: "Period", mod: true, shift: true }], help: "Expand/collapse all descendants; on the title, the whole outline",
        menu: "Expand all/Collapse all",
        menuLabel: (s, t) => ((t === s.zoomId ? topLevelOpen(model, s) : s.expanded.has(t)) ? "Collapse all" : "Expand all") },
      { command: "prevSibling",    chords: [{ key: "ArrowUp", mod: true, alt: true }],   help: "Previous sibling", touch: "Tap an item" },
      { command: "nextSibling",    chords: [{ key: "ArrowDown", mod: true, alt: true }], help: "Next sibling", touch: "Tap an item" },
      { command: "extendUp",       chords: [{ key: "ArrowUp", shift: true }],    help: "Select the previous item too; past the first, its parent", extends: true,
        touch: false, reason: MULTI },
      { command: "extendDown",     chords: [{ key: "ArrowDown", shift: true }],  help: "Select the next item too; past the last, its parent", extends: true,
        touch: false, reason: MULTI },
      { command: "extendFirst",    chords: [{ key: "Home", shift: true }],       help: "Select to the first sibling", extends: true,
        touch: false, reason: MULTI },
      { command: "extendLast",     chords: [{ key: "End", shift: true }],        help: "Select to the last sibling", extends: true,
        touch: false, reason: MULTI },
      { command: "selectTo",       chords: [{ key: "Click", shift: true }],      help: "Select from the selected item to here", passive: true,
        touch: false, reason: MULTI },
      { command: "copy",           chords: [{ key: "c", mod: true }],            help: "Copy the selected items as a markdown list; the title copies the whole document", passive: true,
        menu: "Copy as markdown" },
      { command: "escape",         chords: [{ key: "Escape" }],                  help: "Clear the filter, then the selection; any arrow key selects again",
        menu: "Clear find/Clear selection", menuLabel: (s) => (s.filter !== null ? "Clear find" : "Clear selection") },
      // ⇧⌘3–5 are macOS screenshots and ⌘1–9 switch tabs; ⌥ changes e.key on macOS (⌥1 is ¡), so match e.code.
      { command: "expandLevel",
        chords: [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({ code: `Digit${n}`, mod: true, alt: true, arg: n })),
        label: IS_APPLE ? "⌥⌘1–9" : "Ctrl+Alt+1–9",
        help: "Expand to that many levels below the selected item; on the title, the whole outline",
        menu: "Expand to level", touchHelp: "− and + expand one level less or more below the selected item" },
      // Effect entries run EFFECTS[command] instead of a pure command. ⇧⌘C also opens the
      // DevTools element picker; the page's preventDefault wins where tree keys are routed.
      { command: "copyLink",
        chords: [{ key: "c", mod: true, shift: true }, { key: "C", mod: true, shift: true }],
        label: IS_APPLE ? "⇧⌘C" : "Ctrl+Shift+C",
        help: "Copy a link to the selected item; the title links to the whole document", effect: true, menu: "Copy link" },
      // Touch only: the system share sheet, where the browser has one.
      { command: "share",          chords: [],                                   help: "Share a link to the selected item", menu: "Share…" },
      // ⌘[ and ⌘] are Back/Forward in macOS browsers but not reserved: bound only where tree keys are.
      { command: "zoomIn",         chords: [{ code: "BracketRight", mod: true }], help: "Zoom in: show the selected item as the page", effect: true,
        menu: "Zoom in" },
      { command: "zoomOut",        chords: [{ code: "BracketLeft", mod: true }],  help: "Zoom out one level", effect: true,
        touch: "Up, a crumb, Back, or ⋯ › Zoom out", menu: "Zoom out" },
      { command: "zoomClick",      chords: [{ key: "Click", mod: true }],        help: "On a bullet: zoom in", passive: true,
        touch: "⋯ › Zoom in", touchHelp: "Zoom in: show the selected item as the page" },
      { command: "linkClick",      chords: [{ key: "Click" }],                   help: "On a link to an item: zoom into it", passive: true,
        touch: "Tap a link to an item", touchHelp: "Zoom into it" },
      // global: handled by bindFind wherever it applies, never as a tree key. In the box itself
      // the browser's own find opens.
      { command: "find",           chords: [{ key: "f", mod: true }, { key: "F", mod: true }], label: IS_APPLE ? "⌘F" : "Ctrl+F",
        help: "Find: filter the outline; in the box, press again for the browser's find", global: true,
        touch: "Tap Find", touchHelp: "Filter the outline; ⋯ › Clear find shows it all again" },
      // treeOnly: the document router skips it, so Enter on a header button stays the button's.
      { command: "accept",         chords: [{ key: "Enter" }],                   help: "While finding: keep the selected item and clear the filter", treeOnly: true,
        menu: "Show in outline" },
      { command: "help",           chords: [{ key: "?", shift: "any" }],         help: "Show this help", menu: "Help", touch: "Tap Help" },
    ];
    /** The gesture a KEYMAP entry lists in the touch help, or null. */
    const touchGesture = (e) => (typeof e.touch === "string" ? e.touch : e.menu !== undefined ? `⋯ › ${e.menu}` : null);

    function chordMatches(chord, e) {
      if (chord.key !== undefined && chord.key !== e.key) return false;
      if (chord.code !== undefined && chord.code !== e.code) return false;
      const mod = IS_APPLE ? e.metaKey : e.ctrlKey;
      const other = IS_APPLE ? e.ctrlKey : e.metaKey;
      if (other) return false;
      // Off Apple, Ctrl+Alt is AltGr on many layouts: a character, not a chord. On macOS, Option
      // itself can report AltGraph, so the guard would disable every ⌥ chord there.
      if (chord.alt === true && !IS_APPLE && e.getModifierState?.("AltGraph")) return false;
      const want = { mod, alt: e.altKey, shift: e.shiftKey };
      return Object.entries(want).every(([k, v]) => (chord[k] ?? false) === "any" || (chord[k] ?? false) === v);
    }

    /** The KEYMAP entry an event matches and the matching chord, or undefined. */
    function matchFor(e) {
      for (const entry of KEYMAP) {
        const chord = entry.chords.find((c) => chordMatches(c, e));
        if (chord !== undefined) return { entry, chord };
      }
      return undefined;
    }
    const entryFor = (e) => matchFor(e)?.entry;

    const DIGIT_NAMES = Object.fromEntries([1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => [`Digit${n}`, String(n)]));
    const KEY_NAMES = {
      ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→", Period: ".", Escape: "Esc", Click: "click", c: "C",
      BracketRight: "]", BracketLeft: "[",
      ...DIGIT_NAMES,
    };

    function chordLabel(chord) {
      const key = KEY_NAMES[chord.key ?? chord.code] ?? chord.key ?? chord.code;
      if (IS_APPLE) {
        // macOS order: Option, Shift, Command.
        return (chord.alt === true ? "⌥" : "") + (chord.shift === true ? "⇧" : "") + (chord.mod === true ? "⌘" : "") + key;
      }
      const parts = [];
      if (chord.mod === true) parts.push("Ctrl");
      if (chord.alt === true) parts.push("Alt");
      if (chord.shift === true) parts.push("Shift");
      return [...parts, key].join("+");
    }

    function renderHelp() {
      const dl = document.querySelector("#help .keys");
      dl.replaceChildren();
      for (const { chords, label, help } of KEYMAP) {
        if (chords.length === 0) continue;
        const dt = h("dt");
        if (label !== undefined) dt.append(h("kbd", "", label));
        else chords.forEach((c, i) => {
          if (i > 0) dt.append(" or ");
          dt.append(h("kbd", "", chordLabel(c)));
        });
        dl.append(dt, h("dd", "", help));
      }
      const touch = document.querySelector("#help .touch");
      touch.replaceChildren();
      const seen = new Set();
      for (const e of KEYMAP) {
        const gesture = touchGesture(e);
        if (gesture === null || seen.has(gesture) || (e.command === "share" && !canShare())) continue;
        seen.add(gesture);
        touch.append(h("dt", "", gesture), h("dd", "", e.touchHelp ?? e.help));
      }
    }

    function showHelp() {
      const dialog = document.getElementById("help");
      if (!dialog.open) dialog.showModal();
    }

    const isEditable = (el) =>
      el instanceof Element && (el.isContentEditable || el.closest("input, textarea, select") !== null);

    /** The tree command an event names, as matchFor's { entry, chord }, or undefined: help,
     *  passive and global entries are not. */
    function treeMatchFor(e) {
      const match = matchFor(e);
      return match === undefined || match.entry.command === "help" || match.entry.passive || match.entry.global ? undefined : match;
    }

    function runTreeKey(e, { entry, chord }) {
      e.preventDefault();
      if (state.mode === "idle") {
        // The first key after Escape re-selects the remembered item, without moving.
        if (entry.command !== "escape") dispatch({ mode: "selected" }, { focus: true });
        return;
      }
      if (entry.effect) {
        EFFECTS[entry.command]();
        dispatch(isRange(state) ? {} : null, { focus: true });   // a range collapses, as for any non-extending key
        return;
      }
      const proposal = COMMANDS[entry.command](model, state, chord.arg);
      // Any key but an extending one collapses a range, even when its command does nothing.
      dispatch(proposal ?? (isRange(state) && !entry.extends ? {} : null), { focus: true });
    }

    function bindKeys(outline) {
      outline.addEventListener("keydown", (e) => {
        const match = treeMatchFor(e);
        if (match !== undefined) runTreeKey(e, match);
      });
      // A tree key pressed while focus is on <body> (a stray blur, a text drag outside the
      // tree) or on a header button (where a closed dialog returns focus) goes to the tree.
      // Tree-only keys (Enter) are not routed, and no other tree key is Enter, Space or Tab, so
      // the buttons keep their own keys. Focus in a dialog, the Spacing panel or a form control
      // (the find box) is on neither, so their keys are untouched.
      document.addEventListener("keydown", (e) => {
        const routed = isPageRoot(e.target) || (e.target instanceof Element && e.target.matches(".page-tools button"));
        if (!routed || state.activeId === null) return;
        const match = treeMatchFor(e);
        if (match === undefined || match.entry.treeOnly) return;
        focusActive();
        runTreeKey(e, match);
      });
    }

    /** The subtrees of `ids` as a markdown list that parseOutline reads back: labels, notes and
     *  inline source as written, nested relative to `ids`, collapsed children included. The root
     *  (only ever selected alone) is the whole document: title heading, intro, then the list. */
    function outlineMarkdown(model, ids) {
      if (ids.includes(ROOT)) {
        const { title, intro, items } = model.doc;
        const head = [...(title === null ? [] : [`# ${title}`]), ...intro].join("\n\n");
        const list = items.length === 0 ? "" : outlineMarkdown(model, items.map((n) => n.id));
        return head === "" ? list : list === "" ? `${head}\n` : `${head}\n\n${list}`;
      }
      const lines = [];
      const write = (node, depth) => {
        const pad = "  ".repeat(depth);
        const [first = "", ...notes] = node.text === "" ? [] : node.text.split("\n\n");
        const lead = node.label !== null ? `${node.label} ` : /^\d/.test(first) ? "\\" : "";
        lines.push(`${pad}- ${lead}${first}`.trimEnd());
        for (const note of notes) lines.push("", `${pad}  ${note}`);
        for (const child of node.children) write(child, depth + 1);
      };
      for (const id of ids) write(model.byId.get(id).node, 0);
      return lines.join("\n") + "\n";
    }

    /** Copy with no text selected copies the selected items; a mouse text selection copies as usual. */
    function bindCopy(outline) {
      document.addEventListener("copy", (e) => {
        if (pendingCopy !== null) {                // copyLink's execCommand fallback
          e.clipboardData.setData("text/plain", pendingCopy);
          e.preventDefault();
          return;
        }
        if (state.mode !== "selected" || state.activeId === null) return;
        const text = document.getSelection();
        if (text !== null && !text.isCollapsed) return;
        const ae = document.activeElement;
        if (!(isPageRoot(ae) || outline.contains(ae) || ae.matches(".page-tools button"))) return;
        e.clipboardData.setData("text/plain", outlineMarkdown(model, selectionRoots(model, state)));
        e.preventDefault();
      });
    }

    function bindHelp() {
      const dialog = document.getElementById("help");
      document.getElementById("help-button").addEventListener("click", showHelp);
      // A click on the backdrop (the dialog element itself, outside its box) closes it.
      dialog.addEventListener("click", (e) => {
        if (e.target !== dialog) return;
        const r = dialog.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();
      });
      document.addEventListener("keydown", (e) => {
        if (entryFor(e)?.command !== "help") return;
        if (dialog.contains(e.target) || isEditable(e.target)) return;
        if (e.target instanceof Element && e.target.closest("#spacing")) return;   // the panel keeps its keys
        e.preventDefault();
        showHelp();
      });
    }

    /** The find box: typing filters the current zoom live (law Q). ⌘F (Ctrl+F) from the tree,
     *  the page, a header button or a crumb focuses it; in the box it is the browser's own find.
     *  The box is outside the tree (law D). */
    function bindFind() {
      const input = document.getElementById("find-input");
      // Typing filters without selecting: an idle page stays idle (as Dynalist's search does).
      input.addEventListener("input", () => dispatch({ query: input.value, mode: state.mode }, { focus: false }));
      input.addEventListener("keydown", (e) => {
        // Confirming an IME composition (Korean, Japanese) sends Enter or Esc as part of it.
        if (e.isComposing || e.keyCode === 229) return;

        for (const command of MENU) {
          const offered = menuOffers(command, s0, t);
          if (offered === null) continue;
          if (MENU_BREAKS.has(command) && items.length > 0) items.push(h("hr"));
          const e = entry(command);
          if (command === "expandLevel") {
            const row = h("div", "level");
            row.setAttribute("role", "group");
            row.setAttribute("aria-label", e.menu);
            const out = h("output", "", String(level));
            out.setAttribute("aria-live", "polite");
            const stepBy = (by, text, name) => {
              const b = h("button", "", text);
              b.type = "button";
              b.dataset.command = command;
              b.dataset.step = String(by);
              b.setAttribute("aria-label", name);
              b.disabled = !offered || level + by < 1 || level + by > 9;
              return b;
            };
            row.append(h("span", "", e.menu), stepBy(-1, "−", "One level less"), out, stepBy(1, "+", "One level more"));
            items.push(row);
            continue;
          }
          const b = h("button", "", e.menuLabel?.(asTarget(s0, t), t) ?? e.menu);
          b.type = "button";
          b.dataset.command = command;
          b.disabled = !offered;
          items.push(b);
        }
        list.replaceChildren(...items);
      };
      const sheet = bindSheet(panel, trigger, {
        prepare: () => {
          level = Math.min(9, Math.max(1, openDepth(state, menuTarget())));
          render();
          if (!SHEET_MQ.matches) {
            // With a mouse, the menu drops from its button.
            const r = trigger.getBoundingClientRect();
            panel.style.setProperty("--menu-top", `${Math.round(r.bottom + 4)}px`);
            panel.style.setProperty("--menu-right", `${Math.max(8, Math.round(document.documentElement.clientWidth - r.right))}px`);
          }
        },
        first: () => list.querySelector("button:not(:disabled)"),
        outside: () => true,
      });
      list.addEventListener("click", (e) => {
        const b = e.target.closest?.("button[data-command]");
        if (!b || b.disabled) return;
        if (b.dataset.step !== undefined) {
          level += Number(b.dataset.step);
          runMenu("expandLevel", level);
          render();
          list.querySelector(`button[data-step="${b.dataset.step}"]`)?.focus({ preventScroll: true });
          return;
        }
        // Help opens over the page: the menu hands focus back to its button first, so closing
        // Help returns there. Anything else acts on the outline, and focus goes to the tree.
        sheet.close({ focus: b.dataset.command === "help" });
        runMenu(b.dataset.command);
      });
      return sheet;
    }

    // ── page layout ──────────────────────────────────────
    /** Typeset math wider than its line becomes its own sideways scroller (law M1). Runs when the
     *  outline's size changes (a resize, an expand, a zoom) and after typesetting. */
    function layoutMath() {
      for (const span of document.querySelectorAll('.math[data-math="typeset"]')) {
        const host = span.closest(".text, .intro, #doc-title");
        const math = span.querySelector("mjx-math");
        if (host === null || math === null) continue;
        const wide = math.getBoundingClientRect().width > host.clientWidth + 0.5;
        if (span.classList.contains("wide") === wide) continue;
        span.classList.toggle("wide", wide);
        if (wide) span.tabIndex = -1;   // a scroller Chromium would make a Tab stop: none inside the tree (law D)
        else span.removeAttribute("tabindex");
      }
    }

    /** --head-block: the sticky header's height (0 while it scrolls away), so scrolling an item
     *  into view never leaves it under the header. */
    function bindHead() {
      const head = document.querySelector(".page-head");
      const write = () => {
        const sticky = getComputedStyle(head).position === "sticky";
        root.style.setProperty("--head-block", sticky ? `${Math.ceil(head.getBoundingClientRect().height)}px` : "0px");
      };
      new ResizeObserver(write).observe(head);
      addEventListener("resize", write);
      write();
    }

    // ── spacing ──────────────────────────────────────────
    // Reader-set spacing: the panel writes only the knobs' custom properties on :root, and the
    // tokens layer derives every metric from them. The proximity ladder cannot invert: every
    // item gap is > 0 (the minimum is 2px), and the note gap is derived in CSS as
    // min(3px, --item-gap / 2). So rows sit farther apart than the lines inside a row (row pitch
    // = --line + --item-gap), and a note sits closer to its own item than to the next row.
    const SPACING = [
      { key: "fontSize", prop: "--font-size", label: "Text size",    min: 16,  max: 24,   step: 1,    value: 20,  unit: "px" },
      { key: "lh",       prop: "--lh",        label: "Line height",  min: 1.2, max: 1.9,  step: 0.05, value: 1.5, unit: "" },
      // A coarse pointer's default leaves a 44px row pitch at the default line height.
      { key: "itemGap",  prop: "--item-gap",  label: "Item spacing", min: 2,   max: 28,   step: 1,    value: COARSE_MQ.matches ? 14 : 10, unit: "px" },
      { key: "indent",   prop: "--indent",    label: "Indent",       min: 18,  max: 56,   step: 1,    value: 30,  unit: "px" },
      { key: "column",   prop: "--column",    label: "Column width", min: 560, max: 1200, step: 20,   value: 820, unit: "px" },
    ];
    const SPACING_KEY = "my-tractatus:spacing";
    const spacingDefaults = () => Object.fromEntries(SPACING.map((k) => [k.key, k.value]));

    /** Nearest step inside the knob's range; rounded to kill float noise (1.2 + 7 * 0.05). */
    function snapSpacing(k, v) {
      const n = Math.round((Math.min(k.max, Math.max(k.min, v)) - k.min) / k.step);
      return Number((k.min + n * k.step).toFixed(2));
    }
    const spacingText = (k, v) => (k.unit === "" ? `${v.toFixed(2)}×` : `${v} ${k.unit}`);
    const spacingValueText = (k, v) => (k.unit === "" ? `${v.toFixed(2)} times the text size` : `${v} pixels`);

    /** localStorage, or null when absent or refused; shared by spacing and view state. file://
     *  storage is per file, per directory or one shared origin depending on the browser, and the
     *  getter itself throws a SecurityError when the reader blocks site data, so every access
     *  is guarded. */
    function openStorage() {
      try {
        const s = window.localStorage;
        const probe = "my-tractatus:probe";
        s.setItem(probe, "1");
        s.removeItem(probe);
        return s;
      } catch {
        return null;
      }
    }

    /** Total: stored values are clamped to their ranges; anything unreadable is ignored. */
    function readSpacing(storage) {
      const values = spacingDefaults();
      let raw = null;
      try { raw = JSON.parse(storage?.getItem(SPACING_KEY) ?? "null"); } catch { raw = null; }
      if (raw === null || typeof raw !== "object") return values;
      for (const k of SPACING) {
        const v = raw[k.key];
        if (typeof v === "number" && Number.isFinite(v)) values[k.key] = snapSpacing(k, v);
      }
      return values;
    }

    /** True when the values are stored (defaults are stored as no entry at all). */
    function saveSpacing(storage, values) {
      if (storage === null) return false;
      try {
        if (SPACING.every((k) => values[k.key] === k.value)) storage.removeItem(SPACING_KEY);
        else storage.setItem(SPACING_KEY, JSON.stringify(values));
        return true;
      } catch {
        return false;
      }
    }

    function applySpacing(values) {
      for (const k of SPACING) {
        const v = values[k.key];
        if (v === k.value) root.style.removeProperty(k.prop);
        else root.style.setProperty(k.prop, `${v}${k.unit}`);
      }
    }

    function bindSpacing(storage, values) {
      const panel = document.getElementById("spacing");
      const trigger = document.getElementById("spacing-button");
      const note = document.getElementById("spacing-storage");
      const status = document.getElementById("spacing-status");
      const inputs = new Map();
      let announce = 0;
      const setNote = (saved) => {
        note.textContent = saved ? "Saved in this browser" : "Not saved (storage unavailable)";
      };
      const show = (k) => {
        const { input, output } = inputs.get(k.key);
        const v = values[k.key];
        input.value = String(v);
        input.setAttribute("aria-valuetext", spacingValueText(k, v));
        output.textContent = spacingText(k, v);
      };

      panel.querySelector(".knobs").replaceChildren(...SPACING.map((k) => {
        const id = `spacing-${k.key}`;
        const knob = h("div", "knob");
        const label = h("label", "", k.label);
        label.htmlFor = id;
        const output = h("output");
        output.htmlFor = id;
        output.setAttribute("aria-live", "off");   // the slider's valuetext speaks; no second announcement
        const input = Object.assign(h("input"), { type: "range", id, min: k.min, max: k.max, step: k.step });
        const set = (v) => {
          values[k.key] = snapSpacing(k, v);
          show(k);
          applySpacing(values);
          setNote(saveSpacing(storage, values));
          clearTimeout(announce);
          status.textContent = "";
        };
        input.addEventListener("input", () => set(Number(input.value)));
        // − and +: one step, shown in a sheet (a thumb is hard to move by one step).
        const stepButton = (by, text, name) => {
          const b = Object.assign(h("button", "panel-button step", text), { type: "button" });
          b.setAttribute("aria-label", `${name} ${k.label.toLowerCase()}`);
          b.addEventListener("click", () => set(values[k.key] + by * k.step));
          return b;
        };
        knob.classList.add(`knob-${k.key}`);
        inputs.set(k.key, { input, output });
        knob.append(label, output, stepButton(-1, "−", "Less"), input, stepButton(1, "+", "More"));
        return knob;
      }));
      SPACING.forEach(show);
      setNote(storage !== null);

      // Non-modal: the outline stays live behind it, and with a mouse it stays open while the
      // reader works there; a bottom sheet covers the outline, so a press outside closes it.
      const { close } = bindSheet(panel, trigger, {
        first: () => inputs.get(SPACING[0].key).input,
        outside: () => SHEET_MQ.matches,
      });
      document.getElementById("spacing-close").addEventListener("click", () => close());
      document.getElementById("spacing-reset").addEventListener("click", () => {
        Object.assign(values, spacingDefaults());
        SPACING.forEach(show);
        applySpacing(values);
        setNote(saveSpacing(storage, values));
        // Clear first, so a second reset is announced again.
        clearTimeout(announce);
        status.textContent = "";
        announce = setTimeout(() => { status.textContent = "Spacing reset to defaults"; }, 100);
      });
    }

    // ── view state ───────────────────────────────────────
    // Per-document view (expanded, active, zoom) in localStorage. file:// pages share one origin
    // in Chromium, so the key names the document. Records are proposals: makeState makes them
    // lawful, so stale ids simply vanish. Mode and range are not stored.
    const VIEW_PREFIX = "my-tractatus:view:";
    const VIEW_INDEX = "my-tractatus:view-index";
    const VIEW_LIMIT = 50;
    const SAVE_DELAY = 300;

    /** FNV-1a 32-bit over the UTF-8 bytes, as 8 lower-case hex digits. */
    function fnv1a32hex(text) {
      let h = 0x811c9dc5;
      for (const byte of new TextEncoder().encode(text)) h = Math.imul(h ^ byte, 0x01000193) >>> 0;
      return h.toString(16).padStart(8, "0");
    }

    /** -> { expanded: string[], activeId: string|null, zoomId: string } | null. Total. */
    function readView(storage, key) {
      if (storage === null) return null;
      let v;
      try { v = JSON.parse(storage.getItem(key)); } catch { return null; }
      if (v === null || typeof v !== "object" || Array.isArray(v) || v.v !== 1 || !Array.isArray(v.expanded)) return null;
      return {
        expanded: v.expanded.filter((id) => typeof id === "string"),
        activeId: typeof v.activeId === "string" ? v.activeId : null,
        zoomId: typeof v.zoomId === "string" ? v.zoomId : ROOT,
      };
    }

    /** The index reconciled with the stored keys: deduplicated, no missing records, orphans oldest. */
    function readIndex(storage) {
      let raw;
      try { raw = JSON.parse(storage.getItem(VIEW_INDEX)); } catch { raw = null; }
      if (!Array.isArray(raw)) raw = [];
      const present = new Set();
      for (let i = 0; i < storage.length; i++) {
        const key = storage.key(i);
        if (key !== null && key.startsWith(VIEW_PREFIX)) present.add(key.slice(VIEW_PREFIX.length));
      }
      const listed = [];
      for (let i = raw.length - 1; i >= 0; i--) {         // keep the last occurrence of each hash
        const h = raw[i];
        if (typeof h === "string" && present.has(h) && !listed.includes(h)) listed.unshift(h);
      }
      const orphans = [...present].filter((h) => !listed.includes(h));
      return [...orphans, ...listed];
    }

    /** Best effort: a quota error or revoked permission leaves the page working, unsaved. */
    function writeView(storage, hash, record, isDefault) {
      if (storage === null) return;
      try {
        const index = readIndex(storage).filter((x) => x !== hash);
        if (isDefault) {
          storage.removeItem(VIEW_PREFIX + hash);
        } else {
          storage.setItem(VIEW_PREFIX + hash, JSON.stringify({ v: 1, ...record }));
          index.push(hash);
          while (index.length > VIEW_LIMIT) storage.removeItem(VIEW_PREFIX + index.shift());
        }
        storage.setItem(VIEW_INDEX, JSON.stringify(index));
      } catch { /* quota or a revoked permission: persistence is best effort */ }
    }

    /** Set in main: the storage (or null), this document's hash, and the startup active item. */
    let viewStorage = null;
    let viewHash = "";
    let defaultActive = null;
    /** The serialized record storage holds for this document: read on load, or last written. */
    let lastSaved = "";
    let saveTimer = null;

    const currentZoom = (s = state) => s.zoomId;
    const viewRecord = (s = state) => ({ expanded: [...s.expanded.ids], activeId: s.activeId, zoomId: currentZoom(s) });
    const isDefaultView = (r) => r.expanded.length === 0 && r.activeId === defaultActive && r.zoomId === ROOT;

    function saveView() {
      const r = viewRecord();
      const text = JSON.stringify(r);
      if (text === lastSaved) return;
      writeView(viewStorage, viewHash, r, isDefaultView(r));
      lastSaved = text;
    }

    /** Debounced: one pending save, restarted by each state change. */
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { saveTimer = null; saveView(); }, SAVE_DELAY);
    }

    /** Writes a pending save now (the page is going away); nothing when none is pending. */
    function flushSave() {
      if (saveTimer === null) return;
      clearTimeout(saveTimer);
      saveTimer = null;
      saveView();
    }

    // ── main ─────────────────────────────────────────────
    // Spacing first: the outline is drawn below, so it never paints at the default spacing.
    const root = document.documentElement;
    /** Without hover (a touch screen) a page opens idle: no selection ring until the reader taps. */
    const START_MODE = matchMedia("(hover: none)").matches ? "idle" : "selected";
    const spacingStorage = openStorage();
    const spacing = readSpacing(spacingStorage);
    applySpacing(spacing);

    function decodeSource() {   // total: -> { ok: true, markdown } | { ok: false, reason }
      const el = document.getElementById("outline-source");
      if (el === null) return { ok: false, reason: "the content block is missing" };
      let value;
      try {
        value = JSON.parse(el.textContent);
      } catch (e) {
        return { ok: false, reason: `the content block is not valid JSON (${e.message})` };
      }
      if (typeof value !== "string") return { ok: false, reason: "the content block is not a JSON string" };
      return { ok: true, markdown: value };
    }

    const source = decodeSource();
    window.tractatus = Object.freeze({
      parseOutline,
      source: source.ok ? source.markdown : null,
      state: () => ({ expanded: [...state.expanded.ids].sort(), activeId: state.activeId }),
      zoom: () => state.zoomId,
      find: () => ({
        query: state.query,
        matches: state.filter === null ? [] : [...state.filter.matches],
        shown: state.filter === null ? [] : [...state.filter.shown],
      }),
      selection: () => ({
        mode: state.mode,
        anchorId: state.anchorId,
        activeId: state.activeId,
        selected: model === null ? [] : [...selectedIds(model, state)],
      }),
      parseInline,
      escapeInline,
      linkHref: (dest) => {
        if (model === null) return null;
        const t = linkTarget(dest, model.byId);
        return t && hrefOf(t);
      },
      typeset: () => requestTypeset(document.body),
      commands: () => KEYMAP.map((e) => ({
        command: e.command,
        keys: e.chords.length > 0,
        touch: e.touch ?? null,
        reason: e.reason ?? null,
        menu: e.menu ?? null,
        gesture: touchGesture(e),
      })),
    });
    const status = document.getElementById("status");
    renderHelp();
    bindHelp();
    bindSpacing(spacingStorage, spacing);
    bindHead();

    if (!source.ok) {
      status.textContent = `Cannot read this page's outline: ${source.reason}. Rebuild the page with embed.py.`;
      document.getElementById("outline").hidden = true;
      document.querySelector(".intro").hidden = true;
      root.dataset.outlineReady = "error";
    } else {
      try {
        const doc = parseOutline(source.markdown);
        model = createModel(doc);
        renderDocument(model);
        // Restore this document's stored view (a proposal, made lawful by makeState) at the
        // root; applyLocation then applies the URL (a valid #id or #z= wins over the stored
        // active item and zoom) or the stored zoom.
        viewStorage = spacingStorage;                     // the same openStorage() result
        viewHash = fnv1a32hex(location.pathname + "\n" + DOC_TITLE);
        const stored = readView(viewStorage, VIEW_PREFIX + viewHash);
        defaultActive = makeState(model).activeId;
        state = makeState(model, stored === null ? {} : { expanded: stored.expanded, activeId: stored.activeId });
        // What storage already holds, in lawful form (zoom included).
        lastSaved = JSON.stringify(viewRecord(makeState(model, stored ?? {})));
        sync(BLANK, state);
        bindCrumbs();
        // Scroll is the viewer's: Back to a fragment-less URL at the root keeps the reader's place,
        // a zoom starts at its top, and a #id is revealed. Browser restoration would undo these.
        history.scrollRestoration = "manual";
        applyLocation({ initial: true, stored });
        addEventListener("pagehide", flushSave);
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSave(); });
        addEventListener("popstate", () => applyLocation({ initial: false }));
        addEventListener("hashchange", () => applyLocation({ initial: false }));
        const outline = document.getElementById("outline");
        bindKeys(outline);
        bindMouse(outline);
        bindFocusKeeping();
        bindCopy(outline);
        bindContentLinks();
        bindFind();
        bindActions();
        // In the next frame, not inside the observer: marking math wide resizes the outline again.
        let mathFrame = 0;
        new ResizeObserver(() => {
          cancelAnimationFrame(mathFrame);
          mathFrame = requestAnimationFrame(layoutMath);
        }).observe(outline);
        deriveMathState();                  // "none" when there is no math
        requestTypeset(document.body);      // not awaited: rendering never waits on math
        for (const w of doc.warnings) console.warn(w);
        root.dataset.outlineReady = "true";
      } catch (e) {
        status.textContent = `Cannot render this outline: ${e}`;
        root.dataset.outlineReady = "error";
        throw e;
      }
    }
  </script>
</body>
</html>
