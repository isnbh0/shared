    /** How many levels below `id` are open now (the displayed root is always open). */
    function openDepth(s, id) {
      if (!hasChildren(model, id) || !(id === s.zoomId || isOpen(s, id))) return 0;
      return 1 + Math.max(0, ...childrenOf(model, id).map((n) => openDepth(s, n.id)));
    }

    const MENU = ["zoomIn", "zoomOut", "toggle", "toggleSubtree", "expandSiblings", "expandLevel",
      "copyLink", "share", "copy", "escape", "accept", "help"];
    const MENU_BREAKS = new Set(["toggle", "copyLink", "escape"]);   // a rule before these

    /** Whether the menu offers `command` for target `t`: true, false (disabled) or null (hidden). */
    function menuOffers(command, s0, t) {
      const s = asTarget(s0, t);
      switch (command) {
        case "zoomIn": return zoomInTarget(model, s) !== null;
        case "zoomOut": return zoomOutTarget(model, s) !== null;
        case "expandSiblings": return t !== s.zoomId && COMMANDS.expandSiblings(model, s) !== null;
        case "expandLevel": return COMMANDS.expandLevel(model, s, 1) !== null;
        case "share": return canShare() ? true : null;
        case "escape": return s0.filter !== null || s0.mode === "selected";
        case "accept": return s0.filter === null ? null : s0.mode === "selected" && s0.activeId !== null;
        case "copyLink": case "copy": case "help": return true;
        default: return COMMANDS[command](model, s) !== null;
      }
    }

    /** Runs a menu item on target `t`; `stay`: the menu stays open (the level stepper). */
    function runMenu(command, arg) {
      const s0 = state;
      const t = menuTarget(s0);
      const s = asTarget(s0, t);
      switch (command) {
        case "zoomIn": return setZoom(t, { history: "push", activeId: t, focus: true });
        case "zoomOut": return zoomOut();
        case "copyLink": copyLink(t); return focusActive();
        case "share": share(t); return focusActive();
        case "copy":
          copyMarkdown(s0.mode === "selected" && s0.activeId !== null ? selectionRoots(model, s0) : [s0.zoomId]);
          return focusActive();
        case "help": return showHelp();
        case "expandLevel": {
          const p = COMMANDS.expandLevel(model, s, arg);
          if (p !== null) dispatch({ ...p, mode: s0.mode }, { focus: false });
          return;
        }
        default: {
          const p = COMMANDS[command](model, s, arg);
          if (p === null) return focusActive();
          // A menu action keeps the mode: from an idle page it acts on the page and stays idle.
          dispatch({ ...p, mode: p.mode ?? s0.mode }, { focus: true });
        }
      }
    }

    function bindActions() {
      const panel = document.getElementById("actions");
      const trigger = document.getElementById("actions-button");
      const list = panel.querySelector(".menu");
      const entry = (c) => KEYMAP.find((e) => e.command === c);
      let level = 1;

      const render = () => {
        const s0 = state;
        const t = menuTarget(s0);
        document.getElementById("actions-target").textContent = t === ROOT ? DOC_TITLE : crumbText(model, t);
        const items = [];
        for (const command of MENU) {
          const offered = menuOffers(command, s0, t);
          if (offered === null) continue;
          if (MENU_BREAKS.has(command) && items.length > 0) items.push(h("hr"));
          const e = entry(command);
          if (command === "expandLevel") {
            const row = h("div", "level");
            row.setAttribute("role", "group");
            row.setAttribute("aria-label", e.menu);
            const out = h("output", "", String(level));
            out.setAttribute("aria-live", "polite");
            const stepBy = (by, text, name) => {
              const b = h("button", "", text);
              b.type = "button";
              b.dataset.command = command;
              b.dataset.step = String(by);
              b.setAttribute("aria-label", name);
              b.disabled = !offered || level + by < 1 || level + by > 9;
              return b;
            };
            row.append(h("span", "", e.menu), stepBy(-1, "−", "One level less"), out, stepBy(1, "+", "One level more"));
            items.push(row);
            continue;
          }
          const b = h("button", "", e.menuLabel?.(asTarget(s0, t), t) ?? e.menu);
          b.type = "button";
          b.dataset.command = command;
          b.disabled = !offered;
          items.push(b);
        }
        list.replaceChildren(...items);
      };
      const sheet = bindSheet(panel, trigger, {
        prepare: () => {
          level = Math.min(9, Math.max(1, openDepth(state, menuTarget())));
          render();
          if (!SHEET_MQ.matches) {
            // With a mouse, the menu drops from its button.
            const r = trigger.getBoundingClientRect();
            panel.style.setProperty("--menu-top", `${Math.round(r.bottom + 4)}px`);
            panel.style.setProperty("--menu-right", `${Math.max(8, Math.round(document.documentElement.clientWidth - r.right))}px`);
          }
        },
        first: () => list.querySelector("button:not(:disabled)"),
        outside: () => true,
      });
      list.addEventListener("click", (e) => {
        const b = e.target.closest?.("button[data-command]");
        if (!b || b.disabled) return;
        if (b.dataset.step !== undefined) {
          level += Number(b.dataset.step);
          runMenu("expandLevel", level);
          render();
          list.querySelector(`button[data-step="${b.dataset.step}"]`)?.focus({ preventScroll: true });
          return;
        }
        // Help opens over the page: the menu hands focus back to its button first, so closing
        // Help returns there. Anything else acts on the outline, and focus goes to the tree.
        sheet.close({ focus: b.dataset.command === "help" });
        runMenu(b.dataset.command);
      });
      return sheet;
    }

    // ── page layout ──────────────────────────────────────
    /** Typeset math wider than its line becomes its own sideways scroller (law M1). Runs when the
     *  outline's size changes (a resize, an expand, a zoom) and after typesetting. */
    function layoutMath() {
      for (const span of document.querySelectorAll('.math[data-math="typeset"]')) {
        const host = span.closest(".text, .intro, #doc-title");
        const math = span.querySelector("mjx-math");
        if (host === null || math === null) continue;
        const wide = math.getBoundingClientRect().width > host.clientWidth + 0.5;
        if (span.classList.contains("wide") === wide) continue;
        span.classList.toggle("wide", wide);
        if (wide) span.tabIndex = -1;   // a scroller Chromium would make a Tab stop: none inside the tree (law D)
        else span.removeAttribute("tabindex");
      }
    }

    /** --head-block: the sticky header's height (0 while it scrolls away), so scrolling an item
     *  into view never leaves it under the header. */
    function bindHead() {
      const head = document.querySelector(".page-head");
      const write = () => {
        const sticky = getComputedStyle(head).position === "sticky";
        root.style.setProperty("--head-block", sticky ? `${Math.ceil(head.getBoundingClientRect().height)}px` : "0px");
      };
      new ResizeObserver(write).observe(head);
      addEventListener("resize", write);
      write();
    }

    // ── spacing ──────────────────────────────────────────
    // Reader-set spacing: the panel writes only the knobs' custom properties on :root, and the
    // tokens layer derives every metric from them. The proximity ladder cannot invert: every
    // item gap is > 0 (the minimum is 2px), and the note gap is derived in CSS as
    // min(3px, --item-gap / 2). So rows sit farther apart than the lines inside a row (row pitch
    // = --line + --item-gap), and a note sits closer to its own item than to the next row.
    const SPACING = [
      { key: "fontSize", prop: "--font-size", label: "Text size",    min: 16,  max: 24,   step: 1,    value: 20,  unit: "px" },
      { key: "lh",       prop: "--lh",        label: "Line height",  min: 1.2, max: 1.9,  step: 0.05, value: 1.5, unit: "" },
      // A coarse pointer's default leaves a 44px row pitch at the default line height.
      { key: "itemGap",  prop: "--item-gap",  label: "Item spacing", min: 2,   max: 28,   step: 1,    value: COARSE_MQ.matches ? 14 : 10, unit: "px" },
      { key: "indent",   prop: "--indent",    label: "Indent",       min: 18,  max: 56,   step: 1,    value: 30,  unit: "px" },
      { key: "column",   prop: "--column",    label: "Column width", min: 560, max: 1200, step: 20,   value: 820, unit: "px" },
    ];
    const SPACING_KEY = "my-tractatus:spacing";
    const spacingDefaults = () => Object.fromEntries(SPACING.map((k) => [k.key, k.value]));

    /** Nearest step inside the knob's range; rounded to kill float noise (1.2 + 7 * 0.05). */
    function snapSpacing(k, v) {
      const n = Math.round((Math.min(k.max, Math.max(k.min, v)) - k.min) / k.step);
      return Number((k.min + n * k.step).toFixed(2));
    }
    const spacingText = (k, v) => (k.unit === "" ? `${v.toFixed(2)}×` : `${v} ${k.unit}`);
    const spacingValueText = (k, v) => (k.unit === "" ? `${v.toFixed(2)} times the text size` : `${v} pixels`);

    /** localStorage, or null when absent or refused; shared by spacing and view state. file://
     *  storage is per file, per directory or one shared origin depending on the browser, and the
     *  getter itself throws a SecurityError when the reader blocks site data, so every access
     *  is guarded. */
    function openStorage() {
      try {
        const s = window.localStorage;
        const probe = "my-tractatus:probe";
        s.setItem(probe, "1");
        s.removeItem(probe);
        return s;
      } catch {
        return null;
      }
    }

    /** Total: stored values are clamped to their ranges; anything unreadable is ignored. */
    function readSpacing(storage) {
      const values = spacingDefaults();
      let raw = null;
      try { raw = JSON.parse(storage?.getItem(SPACING_KEY) ?? "null"); } catch { raw = null; }
      if (raw === null || typeof raw !== "object") return values;
      for (const k of SPACING) {
        const v = raw[k.key];
        if (typeof v === "number" && Number.isFinite(v)) values[k.key] = snapSpacing(k, v);
      }
      return values;
    }

    /** True when the values are stored (defaults are stored as no entry at all). */
    function saveSpacing(storage, values) {
      if (storage === null) return false;
      try {
        if (SPACING.every((k) => values[k.key] === k.value)) storage.removeItem(SPACING_KEY);
        else storage.setItem(SPACING_KEY, JSON.stringify(values));
        return true;
      } catch {
        return false;
      }
    }

    function applySpacing(values) {
      for (const k of SPACING) {
        const v = values[k.key];
        if (v === k.value) root.style.removeProperty(k.prop);
        else root.style.setProperty(k.prop, `${v}${k.unit}`);
      }
    }

    function bindSpacing(storage, values) {
      const panel = document.getElementById("spacing");
      const trigger = document.getElementById("spacing-button");
      const note = document.getElementById("spacing-storage");
      const status = document.getElementById("spacing-status");
      const inputs = new Map();
      let announce = 0;
      const setNote = (saved) => {
        note.textContent = saved ? "Saved in this browser" : "Not saved (storage unavailable)";
      };
      const show = (k) => {
        const { input, output } = inputs.get(k.key);
        const v = values[k.key];
        input.value = String(v);
        input.setAttribute("aria-valuetext", spacingValueText(k, v));
        output.textContent = spacingText(k, v);
      };

      panel.querySelector(".knobs").replaceChildren(...SPACING.map((k) => {
        const id = `spacing-${k.key}`;
        const knob = h("div", "knob");
        const label = h("label", "", k.label);
        label.htmlFor = id;
        const output = h("output");
        output.htmlFor = id;
        output.setAttribute("aria-live", "off");   // the slider's valuetext speaks; no second announcement
        const input = Object.assign(h("input"), { type: "range", id, min: k.min, max: k.max, step: k.step });
        const set = (v) => {
          values[k.key] = snapSpacing(k, v);
          show(k);
          applySpacing(values);
          setNote(saveSpacing(storage, values));
          clearTimeout(announce);
          status.textContent = "";
        };
        input.addEventListener("input", () => set(Number(input.value)));
        // − and +: one step, shown in a sheet (a thumb is hard to move by one step).
        const stepButton = (by, text, name) => {
          const b = Object.assign(h("button", "panel-button step", text), { type: "button" });
          b.setAttribute("aria-label", `${name} ${k.label.toLowerCase()}`);
          b.addEventListener("click", () => set(values[k.key] + by * k.step));
          return b;
        };
        knob.classList.add(`knob-${k.key}`);
        inputs.set(k.key, { input, output });
        knob.append(label, output, stepButton(-1, "−", "Less"), input, stepButton(1, "+", "More"));
        return knob;
      }));
      SPACING.forEach(show);
      setNote(storage !== null);

      // Non-modal: the outline stays live behind it, and with a mouse it stays open while the
      // reader works there; a bottom sheet covers the outline, so a press outside closes it.
      const { close } = bindSheet(panel, trigger, {
        first: () => inputs.get(SPACING[0].key).input,
        outside: () => SHEET_MQ.matches,
      });
      document.getElementById("spacing-close").addEventListener("click", () => close());
      document.getElementById("spacing-reset").addEventListener("click", () => {
        Object.assign(values, spacingDefaults());
        SPACING.forEach(show);
        applySpacing(values);
        setNote(saveSpacing(storage, values));
        // Clear first, so a second reset is announced again.
        clearTimeout(announce);
        status.textContent = "";
        announce = setTimeout(() => { status.textContent = "Spacing reset to defaults"; }, 100);
      });
    }

    // ── view state ───────────────────────────────────────
    // Per-document view (expanded, active, zoom) in localStorage. file:// pages share one origin
    // in Chromium, so the key names the document. Records are proposals: makeState makes them
    // lawful, so stale ids simply vanish. Mode and range are not stored.
    const VIEW_PREFIX = "my-tractatus:view:";
    const VIEW_INDEX = "my-tractatus:view-index";
    const VIEW_LIMIT = 50;
    const SAVE_DELAY = 300;

    /** FNV-1a 32-bit over the UTF-8 bytes, as 8 lower-case hex digits. */
    function fnv1a32hex(text) {
      let h = 0x811c9dc5;
      for (const byte of new TextEncoder().encode(text)) h = Math.imul(h ^ byte, 0x01000193) >>> 0;
      return h.toString(16).padStart(8, "0");
    }

    /** -> { expanded: string[], activeId: string|null, zoomId: string } | null. Total. */
    function readView(storage, key) {
      if (storage === null) return null;
      let v;
      try { v = JSON.parse(storage.getItem(key)); } catch { return null; }
      if (v === null || typeof v !== "object" || Array.isArray(v) || v.v !== 1 || !Array.isArray(v.expanded)) return null;
      return {
        expanded: v.expanded.filter((id) => typeof id === "string"),
        activeId: typeof v.activeId === "string" ? v.activeId : null,
        zoomId: typeof v.zoomId === "string" ? v.zoomId : ROOT,
      };
    }

    /** The index reconciled with the stored keys: deduplicated, no missing records, orphans oldest. */
    function readIndex(storage) {
      let raw;
      try { raw = JSON.parse(storage.getItem(VIEW_INDEX)); } catch { raw = null; }
      if (!Array.isArray(raw)) raw = [];
      const present = new Set();
      for (let i = 0; i < storage.length; i++) {
        const key = storage.key(i);
        if (key !== null && key.startsWith(VIEW_PREFIX)) present.add(key.slice(VIEW_PREFIX.length));
      }
      const listed = [];
      for (let i = raw.length - 1; i >= 0; i--) {         // keep the last occurrence of each hash
        const h = raw[i];
        if (typeof h === "string" && present.has(h) && !listed.includes(h)) listed.unshift(h);
      }
      const orphans = [...present].filter((h) => !listed.includes(h));
      return [...orphans, ...listed];
    }

    /** Best effort: a quota error or revoked permission leaves the page working, unsaved. */
    function writeView(storage, hash, record, isDefault) {
      if (storage === null) return;
      try {
        const index = readIndex(storage).filter((x) => x !== hash);
        if (isDefault) {
          storage.removeItem(VIEW_PREFIX + hash);
        } else {
          storage.setItem(VIEW_PREFIX + hash, JSON.stringify({ v: 1, ...record }));
          index.push(hash);
          while (index.length > VIEW_LIMIT) storage.removeItem(VIEW_PREFIX + index.shift());
        }
        storage.setItem(VIEW_INDEX, JSON.stringify(index));
      } catch { /* quota or a revoked permission: persistence is best effort */ }
    }

    /** Set in main: the storage (or null), this document's hash, and the startup active item. */
    let viewStorage = null;
    let viewHash = "";
    let defaultActive = null;
    /** The serialised record storage holds for this document: read on load, or last written. */
    let lastSaved = "";
    let saveTimer = null;

    const currentZoom = (s = state) => s.zoomId;
    const viewRecord = (s = state) => ({ expanded: [...s.expanded.ids], activeId: s.activeId, zoomId: currentZoom(s) });
    const isDefaultView = (r) => r.expanded.length === 0 && r.activeId === defaultActive && r.zoomId === ROOT;

    function saveView() {
      const r = viewRecord();
      const text = JSON.stringify(r);
      if (text === lastSaved) return;
      writeView(viewStorage, viewHash, r, isDefaultView(r));
      lastSaved = text;
    }

    /** Debounced: one pending save, restarted by each state change. */
    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => { saveTimer = null; saveView(); }, SAVE_DELAY);
    }

    /** Writes a pending save now (the page is going away); nothing when none is pending. */
    function flushSave() {
      if (saveTimer === null) return;
      clearTimeout(saveTimer);
      saveTimer = null;
      saveView();
    }

    // ── main ─────────────────────────────────────────────
    // Spacing first: the outline is drawn below, so it never paints at the default spacing.
    const root = document.documentElement;
    /** Without hover (a touch screen) a page opens idle: no selection ring until the reader taps. */
    const START_MODE = matchMedia("(hover: none)").matches ? "idle" : "selected";
    const spacingStorage = openStorage();
    const spacing = readSpacing(spacingStorage);
    applySpacing(spacing);

    function decodeSource() {   // total: -> { ok: true, markdown } | { ok: false, reason }
      const el = document.getElementById("outline-source");
      if (el === null) return { ok: false, reason: "the content block is missing" };
      let value;
      try {
        value = JSON.parse(el.textContent);
      } catch (e) {
        return { ok: false, reason: `the content block is not valid JSON (${e.message})` };
      }
      if (typeof value !== "string") return { ok: false, reason: "the content block is not a JSON string" };
      return { ok: true, markdown: value };
    }

    const source = decodeSource();
    window.tractatus = Object.freeze({
      parseOutline,
      source: source.ok ? source.markdown : null,
      state: () => ({ expanded: [...state.expanded.ids].sort(), activeId: state.activeId }),
      zoom: () => state.zoomId,
      find: () => ({
        query: state.query,
        matches: state.filter === null ? [] : [...state.filter.matches],
        shown: state.filter === null ? [] : [...state.filter.shown],
      }),
      selection: () => ({
        mode: state.mode,
        anchorId: state.anchorId,
        activeId: state.activeId,
        selected: model === null ? [] : [...selectedIds(model, state)],
      }),
      parseInline,
      escapeInline,
      linkHref: (dest) => {
        if (model === null) return null;
        const t = linkTarget(dest, model.byId);
        return t && hrefOf(t);
      },
      typeset: () => requestTypeset(document.body),
      commands: () => KEYMAP.map((e) => ({
        command: e.command,
        keys: e.chords.length > 0,
        touch: e.touch ?? null,
        reason: e.reason ?? null,
        menu: e.menu ?? null,
        gesture: touchGesture(e),
      })),
    });
    const status = document.getElementById("status");
    renderHelp();
    bindHelp();
    bindSpacing(spacingStorage, spacing);
    bindHead();

    if (!source.ok) {
      status.textContent = `Cannot read this page's outline: ${source.reason}. Rebuild the page with embed.py.`;
      document.getElementById("outline").hidden = true;
      document.querySelector(".intro").hidden = true;
      root.dataset.outlineReady = "error";
    } else {
      try {
        const doc = parseOutline(source.markdown);
        model = createModel(doc);
        renderDocument(model);
        // Restore this document's stored view (a proposal, made lawful by makeState) at the
        // root; applyLocation then applies the URL (a valid #id or #z= wins over the stored
        // active item and zoom) or the stored zoom.
        viewStorage = spacingStorage;                     // the same openStorage() result
        viewHash = fnv1a32hex(location.pathname + "\n" + DOC_TITLE);
        const stored = readView(viewStorage, VIEW_PREFIX + viewHash);
        defaultActive = makeState(model).activeId;
        state = makeState(model, stored === null ? {} : { expanded: stored.expanded, activeId: stored.activeId });
        // What storage already holds, in lawful form (zoom included).
        lastSaved = JSON.stringify(viewRecord(makeState(model, stored ?? {})));
        sync(BLANK, state);
        bindCrumbs();
        // Scroll is the viewer's: Back to a fragment-less URL at the root keeps the reader's place,
        // a zoom starts at its top, and a #id is revealed. Browser restoration would undo these.
        history.scrollRestoration = "manual";
        applyLocation({ initial: true, stored });
        addEventListener("pagehide", flushSave);
        document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushSave(); });
        addEventListener("popstate", () => applyLocation({ initial: false }));
        addEventListener("hashchange", () => applyLocation({ initial: false }));
        const outline = document.getElementById("outline");
        bindKeys(outline);
        bindMouse(outline);
        bindFocusKeeping();
        bindCopy(outline);
        bindContentLinks();
        bindFind();
        bindActions();
        // In the next frame, not inside the observer: marking math wide resizes the outline again.
        let mathFrame = 0;
        new ResizeObserver(() => {
          cancelAnimationFrame(mathFrame);
          mathFrame = requestAnimationFrame(layoutMath);
        }).observe(outline);
        deriveMathState();                  // "none" when there is no math
        requestTypeset(document.body);      // not awaited: rendering never waits on math
        for (const w of doc.warnings) console.warn(w);
        root.dataset.outlineReady = "true";
      } catch (e) {
        status.textContent = `Cannot render this outline: ${e}`;
        root.dataset.outlineReady = "error";
        throw e;
      }
    }
  </script>
</body>
</html>
