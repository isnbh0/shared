<!doctype html>
<html lang="en" data-math-timeout="15000">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js; style-src 'unsafe-inline'; font-src https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/output/chtml/fonts/; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Outline</title>
  <style>
    @layer reset, tokens, base, layout, components, states;

    @layer reset {
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; }
      .outline, .outline ul { list-style: none; margin: 0; padding: 0; }
    }

    @layer tokens {
      :root {
        /* Dynalist theme_default / theme_dark */
        --bg: light-dark(#fff, #181818);
        --fg: light-dark(#222, #eee);
        --note: light-dark(#4e4e4e, #cacaca);
        --bullet: light-dark(#7a7a7a, #a7a7a7);       /* graphics: >= 3:1 on --bg and --active */
        --label: light-dark(#6b6b6b, #a7a7a7);        /* text: Dynalist's #7a7a7a is 4.29:1 on white */
        --chrome-hover: light-dark(#4e4e4e, #cacaca);
        --guide: light-dark(#eee, #444);              /* decorative, exempt from law V */
        --active: light-dark(#cce8ff, #003766);
        --selection: light-dark(rgb(204 232 255 / 0.99), rgb(0 55 102 / 0.99));
        --code-fg: light-dark(#c7254e, #e26182);      /* dark: #c7254e is ~2.9:1 on #262626 */
        --code-bg: light-dark(#f5f5f5, #262626);
        --link-focus: #008aff;                        /* Dynalist theme-color */
        /* Spacing panel: a raised surface, retuned per scheme rather than inverted. Light: white
           card, hairline border, soft shadow. Dark: a surface lighter than the page, since a
           shadow barely reads on #181818, with a border that separates it from the page. */
        --panel-bg: light-dark(#fff, #242424);
        --panel-border: light-dark(#ddd, #3d3d3d);
        --panel-shadow: light-dark(rgb(0 0 0 / 0.12), rgb(0 0 0 / 0.6));
        /* Find: Dynalist's match yellow; its dark #74740e is 3.02:1 under notes, so the lightest
           olive step that keeps --note >= 4.5:1. The box border is Dynalist's. */
        --match: light-dark(#ffff99, #58580b);
        --find-border: light-dark(#ccc, #444);

        /* Reader knobs. The Spacing panel sets only these five, as inline style on :root. Line
           height is a ratio and the note size follows the text size, so size and leading stay
           coupled. Dynalist large / cozy is 20/24 with a 32px pitch; these defaults are looser. */
        --font-size: 20px;
        --lh: 1.5;
        --item-gap: 10px;     /* space between consecutive rows */
        --indent: 30px;       /* per level: a child's row starts under its parent's text */
        --column: 820px;

        --line: calc(var(--font-size) * var(--lh));             /* 30px */
        --note-size: calc(var(--font-size) - 3px);              /* 17px */
        --note-line: calc(var(--note-size) * var(--lh));        /* 25.5px */
        --note-gap: 0px;      /* Dynalist: a note's line box starts where its item's first line ends */
        --title-size: 28px;
        --title-line: 34px;
        --title-inset: 6px;   /* the root row's highlight is flush with the rows'; its text clears the ring */
        --bullet-col: 22px;
        --text-gap: 4px;      /* Dynalist: 15px from the bullet centre (11px in) to the text; a child
                                 starts --indent - 26px right of its parent's text (4px by default) */
        --column-pad-start: 88px;   /* Dynalist: the title's text starts 88px into the column */
        --column-pad-end: 34px;     /* Dynalist: the page tools end 34px before the column's edge */
        --group-gap: 4px;     /* Dynalist: extra space after each nested group of children closes */

        --page-pad: 16px;     /* narrow viewports: the page's inline padding */
        --hit: 24px;          /* the smallest target (WCAG 2.5.8); 44px under a coarse pointer */

        --font-ui: "Whitney", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        --font-mono: Consolas, ui-monospace, SFMono-Regular, Menlo, Courier, monospace;
      }
      /* A finger: 44px targets (WCAG 2.5.5), rows 44px apart, and room for the bullet's slop at
         the page's edge. The Spacing panel's item-gap default follows (SPACING in the script). */
      @media (any-pointer: coarse) {
        :root { --item-gap: 14px; --hit: 44px; --page-pad: 20px; }
      }
    }

    @layer base {
      html {
        background: var(--bg);
        color: var(--fg);
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;   /* :active and :focus-visible styles instead */
        scroll-padding-block-start: var(--head-block, 0px);   /* the sticky header's height */
      }
      /* No double-tap zoom delay on controls; pinch zoom stays everywhere. */
      button, input, a, .toggle { touch-action: manipulation; }
      body {
        font: 16px/1.25 var(--font-ui);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      ::selection { background: var(--selection); }
      strong { font-weight: 700; }
      em { font-style: italic; }
    }

    @layer layout {
      main, .page-head {
        max-inline-size: var(--column);   /* border-box: includes the padding */
        margin-inline: auto;
        padding-inline: var(--column-pad-start) var(--column-pad-end);
      }
      /* The header holds the breadcrumbs (when zoomed), the find box and the page tools above the
         title: the title is the tree's root item, so it spans the whole column. The box and the
         tools sit at the end. The crumbs take the rest of the row while it leaves them 12rem, and
         otherwise a row of their own below it (the container query), so they never collapse. The
         header keeps its height at every column width while the crumbs are hidden (the column knob
         never moves the title). */
      .page-head {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        flex-wrap: wrap;
        row-gap: 8px;
        column-gap: 16px;
        container-type: inline-size;
        /* Dynalist's icon row and title; the tools end on the column's edge, like its icons. */
        padding-block-start: 25px;
        padding-inline-end: 8px;
        margin-block-end: 9.5px;
      }
      /* Zoomed, Dynalist's header row sits 13px lower and the title 13px lower; its crumbs
         start 11px before the title and sit slightly below the row's centre. */
      .page-head:has(> #crumbs:not([hidden])) { padding-block-start: 38px; margin-block-end: 9px; }
      #crumbs { position: relative; inset-block-start: 1.5px; margin-inline-start: -11px; }
      .find { order: 1; }
      .page-tools { order: 2; display: flex; flex: none; gap: 16px; }
      #crumbs { display: flex; align-items: center; gap: 8px; flex: 1 1 0; min-inline-size: 12rem; }
      /* One line that scrolls sideways (renderCrumbs scrolls it to the end): each crumb shrinks to
         6em and ellipsises before the line scrolls. */
      #crumbs ol {
        display: flex;
        flex: 1 1 auto;
        flex-wrap: nowrap;
        min-inline-size: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-x: auto;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
      }
      #crumbs li { display: flex; align-items: center; min-inline-size: min(6em, max-content); flex: 0 1 auto; }
      #crumbs li::after { content: ">" / ""; flex: none; padding-inline: 9px; color: var(--label); }
      #crumbs li:last-child::after { padding-inline-end: 0; }
      #up-button { display: none; }
      @container (max-width: 42rem) {
        #crumbs { order: 3; flex-basis: 100%; min-inline-size: 0; inset-block-start: 0; margin-inline-start: 0; }
        .find { flex: 1 1 8rem; }
      }
      main { padding-block-end: max(50px, env(safe-area-inset-bottom)); container-type: inline-size; }
      #doc-title {
        margin: 0;
        font-size: var(--title-size);
        line-height: var(--title-line);
        font-weight: 400;
        overflow-wrap: anywhere;
      }
      .intro {
        margin-block-start: 5px;                /* the root's note sits 5px under the title */
        font-size: var(--note-size);
        line-height: var(--note-line);
        color: var(--note);
        overflow-wrap: anywhere;
      }
      .intro p { margin: 0; }
      .intro p + p { margin-block-start: var(--note-line); }
      .outline { font-size: var(--font-size); line-height: var(--line); }
      /* A group's 1px guide runs under its parent's bullet centre (10px margin, then the border,
         whose right edge is the bullet centre at 11px), and the padding makes up the rest of the
         step: 10 + 1 + (step - 11) = step. The step is the indent, capped so that the deepest level
         of the displayed tree (--depth, set by renderTree) keeps a 16ch measure in the column
         (law M3): 100cqi is #main's content width. Below an 11px step the guide moves in with it. */
      .outline ul {
        /* 16.5ch: the ch unit comes from the first available font, which can run a few percent
           narrower than the digits the system font renders. */
        /* 16.5ch: the ch unit comes from the first available font, which can run a few percent
           narrower than the digits the system font renders. */
        --measure: calc(100cqi - var(--bullet-col) - var(--text-gap) - 16.5ch);
        --step: min(var(--indent), max(2px, var(--measure) / max(1, var(--depth, 1) - 1)));
        margin-inline-start: min(calc(var(--bullet-col) / 2 - 1px), calc(var(--step) - 1px));
        padding-inline-start: max(0px, calc(var(--step) - var(--bullet-col) / 2));
        border-inline-start: 1px solid var(--guide);
      }
      /* Dynalist leaves --group-gap after each nested group closes. The margin sits outside the
         group's border, so its guide ends at its last descendant, but inside its item, which is a
         block formatting context: the gap belongs to the item (a range fill covers it), two groups
         closing together leave 2 * --group-gap, and the outer guide runs past the inner one by
         --group-gap, as Dynalist's does. A guide starts at its parent's text, not its row: the
         group rises into the row's bottom padding. */
      .outline [role="treeitem"] { display: flow-root; }
      .outline [role="group"] {
        margin-block: calc(var(--item-gap) / -2) var(--group-gap);
        padding-block-start: calc(var(--item-gap) / 2);
      }
      /* The root's children are the top level: no indent and no guide. */
      #item-root > [role="group"] { margin: 0; padding: 0; border: 0; }
      /* The label gutter grows with the longest label (--label-chars, set by renderTree): monospace
         advances are at most 0.62em, and the label ends 8px left of the outline. */
      main, .page-head {
        padding-inline-start: max(var(--column-pad-start), calc(var(--label-chars, 0) * 0.62 * 12px + 8px));
      }
      /* Narrow viewports (WCAG 1.4.10 reflow at 320px): the column knob is ignored, and the indent
         scales down (16px at the default 30px), still capped by the measure. */
      @media (max-width: 40rem) {
        main, .page-head {
          padding-inline: max(var(--page-pad), env(safe-area-inset-left)) max(var(--page-pad), env(safe-area-inset-right));
          max-inline-size: none;
        }
        .outline ul { --step: min(var(--indent) * 16 / 30, max(2px, var(--measure) / max(1, var(--depth, 1) - 1))); }
      }
      /* Phones and tablets: a compact header that stays on screen (find, the ⋯ menu and Up are
         always in reach), except where the viewport is too short to spare it. */
      @media (max-width: 40rem), (hover: none) {
        .page-head, .page-head:has(> #crumbs:not([hidden])) {
          position: sticky;
          inset-block-start: 0;
          z-index: 2;
          background: var(--bg);
          padding-block: max(8px, env(safe-area-inset-top)) 8px;
          margin-block-end: 9.5px;
          border-block-end: 1px solid var(--guide);
        }
        .page-tools { gap: 4px; }
        #crumbs { inset-block-start: 0; margin-inline-start: 0; }
        #up-button { display: inline-flex; }
      }
      @media (max-height: 25rem) {
        .page-head, .page-head:has(> #crumbs:not([hidden])) { position: static; }
      }
    }

    @layer components {
      /* Bullet, label and text share the first line's baseline (law M2): the toggle's line box
         has the same strut as the text's first line, so a taller first line (typeset math) moves
         the bullet down with its baseline instead of overprinting it. */
      .row {
        display: flex;
        align-items: baseline;
        gap: var(--text-gap);
        /* Dynalist's highlight reaches a whole gap above the text and half a gap below, so a row
           rises half a gap into the one before it; the pitch stays line + gap. */
        padding-block: var(--item-gap) calc(var(--item-gap) / 2);
        margin-block-start: calc(var(--item-gap) / -2);
      }
      .text { flex: 1 1 auto; min-inline-size: 0; overflow-wrap: anywhere; }
      .para { display: block; }
      /* The root row: title and intro, no bullet. It starts --title-inset before the item rows, so
         the title's text lines up with the column's start while its highlight keeps room for the
         focus ring. The 10px below it matches Dynalist's gap from the title to the first item. */
      .row.root-row {
        display: block;
        padding-inline: var(--title-inset);
        margin-inline-start: calc(-1 * var(--title-inset));
        margin-block: 0 10px;
        padding-block: calc(var(--item-gap) / 2);
      }
      .para + .para {                           /* Dynalist note */
        font-size: var(--note-size);
        line-height: var(--note-line);
        color: var(--note);
        margin: var(--note-gap) 0 0;
      }
      /* Number labels sit in a gutter left of the outline, on the first line's baseline. The label
         is the first thing in the item's first paragraph (so it is read first, as part of the
         item's name), inside a zero-size .gutter whose strut puts its line's baseline on the
         text's. The label's containing block is #outline (no element between them is positioned),
         so its right edge is 8px left of the outline at every depth. */
      .outline { position: relative; }
      .gutter {
        display: inline-block;
        inline-size: 0;
        block-size: 0;
        font: 12px/var(--line) var(--font-mono);
        white-space: nowrap;
      }
      .gutter::before { content: ""; display: inline-block; }
      .label {
        position: absolute;
        inset-inline-end: calc(100% + 8px);
        font: inherit;
        font-variant-numeric: tabular-nums;
        color: var(--label);
      }
      /* Narrow viewports: the label is an inline prefix of the text that wraps with it, so it never
         takes the measure from the text. */
      @media (max-width: 40rem) {
        .gutter { display: contents; line-height: 1; white-space: normal; }   /* the space after the label breaks */
        .gutter::before { content: none; }
        .label { position: static; line-height: 1; white-space: nowrap; }
      }
      /* The bullet is the toggle, a --bullet-col x --line box whose glyph centre is on the first
         line's centre, 11px in. Its hit area reaches over the gap to the text and, under a coarse
         pointer, --slop-s before it and --slop-b above and below (44px at the default spacing);
         the negative margins keep the layout where the glyph box alone would put it. ::before is
         in flow (it gives the toggle the line box that sets its baseline); ::after is the ring. */
      .toggle {
        --slop-s: 0px;
        --slop-b: 0px;
        flex: none;
        position: relative;
        box-sizing: content-box;
        inline-size: var(--bullet-col);
        block-size: var(--line);
        padding: var(--slop-b) var(--text-gap) var(--slop-b) var(--slop-s);
        margin: calc(-1 * var(--slop-b)) calc(-1 * var(--text-gap)) calc(-1 * var(--slop-b)) calc(-1 * var(--slop-s));
        user-select: none;
        -webkit-user-select: none;
      }
      @media (any-pointer: coarse) {
        .toggle {
          --slop-s: 18px;
          --slop-b: max(0px, min(44px - var(--line), var(--item-gap)) / 2);
          z-index: 1;   /* the slop reaches under a wide gutter's label: the bullet wins the tap */
        }
      }
      .toggle::before,
      .toggle::after {
        content: "";
        box-sizing: border-box;
        translate: -50% -50%;
      }
      /* leaf or expanded: 6.4px disc */
      .toggle::before {
        display: inline-block;
        vertical-align: top;
        position: relative;
        left: calc(var(--bullet-col) / 2);
        top: calc(var(--line) / 2);
        inline-size: 6.4px;
        block-size: 6.4px;
        border-radius: 50%;
        background: var(--bullet);
      }
      .toggle::after {
        display: none;
        position: absolute;
        left: calc(var(--slop-s) + var(--bullet-col) / 2);
        top: calc(var(--slop-b) + var(--line) / 2);
      }
      /* collapsed parent: 6px dot inside a 12px ring (1.5px stroke, 1.5px gap). The stroke is an
         inset shadow: Chromium floors border widths to whole CSS pixels, so a 1.5px border paints 1px. */
      [aria-expanded="false"] > .row > .toggle::before { inline-size: 6px; block-size: 6px; }
      [aria-expanded="false"] > .row > .toggle::after {
        display: block;
        inline-size: 12px;
        block-size: 12px;
        border-radius: 50%;
        box-shadow: inset 0 0 0 1.5px var(--bullet);
      }
      @media (hover: hover) {
        /* expanded parent: minus */
        [aria-expanded] > .row:hover > .toggle::before {
          inline-size: 11px;
          block-size: 1.5px;
          border-radius: 0;
        }
        /* collapsed parent: plus */
        [aria-expanded="false"] > .row:hover > .toggle::before { inline-size: 10.5px; }
        [aria-expanded="false"] > .row:hover > .toggle::after {
          inline-size: 1.5px;
          block-size: 10.5px;
          box-shadow: none;
          border-radius: 0;
          background: var(--bullet);
        }
      }
      code, .math:not([data-math="typeset"]) {
        font-family: var(--font-mono);
        font-size: calc(var(--font-size) - 2px);
        line-height: 1;                       /* the mono box must not grow the --line line box */
        padding: 0 5px;
        border-radius: 4px;
        background: var(--code-bg);
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      code { color: var(--code-fg); }
      .math:not([data-math="typeset"]) { color: var(--fg); }
      .para + .para code,
      .para + .para .math:not([data-math="typeset"]) { font-size: calc(var(--note-size) - 2px); }
      .intro code,
      .intro .math:not([data-math="typeset"]) { font-size: calc(var(--note-size) - 2px); }
      .row mjx-container { font-size: 1em; }
      /* Math wider than its line scrolls sideways inside its own box (law M1). layoutMath marks
         it: an inline-block that scrolls has no text baseline in every engine, so it is top-aligned. */
      .math.wide {
        display: inline-block;
        max-inline-size: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        vertical-align: top;
        overscroll-behavior-x: contain;
        padding-block: 2px;
      }
      /* MathJax's clipped copy for screen readers is as wide as its MathML, which can be wider
         than the typeset math: at 1px it no longer widens the page. (A layered !important beats
         MathJax's unlayered one.) */
      .math mjx-assistive-mml { width: 1px !important; }
      .text a, .intro a, #doc-title a { color: inherit; text-decoration: underline; }
      .help-button, .panel-button, form[method="dialog"] button, .menu button {
        flex: none;
        border: 0;
        background: none;
        padding: 4px 0;
        font: 14px/20px var(--font-ui);
        color: var(--label);
        cursor: pointer;
      }
      .panel-button { padding: 2px 0; min-inline-size: 24px; }       /* 24px tall */
      #actions-button { min-inline-size: var(--hit); font-size: 18px; }
      #up-button { gap: 4px; align-items: center; }
      @media (hover: hover) {
        .help-button:hover, .panel-button:hover, form[method="dialog"] button:hover {
          color: var(--chrome-hover);
          text-decoration: underline;
        }
        #crumbs a:hover { text-decoration: underline; }
        .menu button:not(:disabled):hover { background: var(--active); }
      }
      .help-button:focus-visible, .panel-button:focus-visible, form[method="dialog"] button:focus-visible,
      .menu button:focus-visible, #spacing input:focus-visible {
        outline: 2px solid var(--link-focus);
        outline-offset: 2px;
      }
      .menu button:focus-visible { outline-offset: -2px; }
      /* Crumbs: plain text in the text colour; the ellipsis sits on the link, so the ">" before
         it is never clipped. */
      #crumbs a {
        min-inline-size: min(var(--hit), 100%);
        max-inline-size: 16em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 16px/24px var(--font-ui);
        color: var(--fg);
        text-decoration: none;
      }
      #crumbs a:focus-visible { text-decoration: underline; outline: 2px solid var(--link-focus); outline-offset: -2px; }
      @media (max-width: 40rem) {
        #crumbs a { max-inline-size: 12em; }
      }
      /* Find: Dynalist's box (18px text, 30px tall, 300px wide, radius 5), with the label colour
         for its text and placeholder (law V: Dynalist's lighter grey is 4.29:1 on white). */
      .find { display: flex; align-items: center; min-inline-size: 0; }
      .find input {
        font: inherit;
        font-size: 18px;
        block-size: 30px;
        inline-size: 300px;
        min-inline-size: 0;
        border: 1px solid var(--find-border);
        border-radius: 5px;
        background: var(--bg);
        color: var(--label);
        padding-inline: 8px;
      }
      .find input:focus-visible { outline: 2px solid var(--link-focus); outline-offset: 1px; }
      .find input::placeholder { color: var(--label); opacity: 1; }
      /* The count sits before the box, so the box stays put at the header's end as the count
         appears and changes; on a narrow header the box starts the line and the count follows. */
      .find-count {
        order: -1;
        color: var(--label);
        font-size: 15px;
        margin-inline-end: 8px;
        white-space: nowrap;
        flex: none;
      }
      .find-count:empty { margin-inline-end: 0; }
      ::highlight(find) { background-color: var(--match); color: var(--fg); }
      /* A narrow header shares one row between the box and the tools: the count sits inside the
         box's end, over room the box keeps free for it. */
      @container (max-width: 42rem) {
        .find { position: relative; max-inline-size: 300px; }
        .find input { inline-size: 100%; }
        .find:has(.find-count:not(:empty)) input { padding-inline-end: 6.5em; }
        .find-count {
          position: absolute;
          inset-inline-end: 8px;
          margin: 0;
          font-size: 13px;
          pointer-events: none;
        }
      }
      /* Coarse pointers: every control is a 44px target (law M4). */
      @media (any-pointer: coarse) {
        .help-button, .panel-button, form[method="dialog"] button {
          min-block-size: 44px;
          min-inline-size: 44px;
          padding: 4px 8px;
        }
        #actions-button { font-size: 22px; }
        #crumbs a { line-height: 44px; }
        .find input { block-size: 44px; }
      }
      dialog {
        max-inline-size: min(40rem, 90vw);
        border: 0;
        border-radius: 6px;
        padding: 20px 24px;
        background: var(--bg);
        color: var(--fg);
        font: 15px/20px var(--font-ui);
        box-shadow: 0 5px 20px rgb(0 0 0 / 0.25);
      }
      dialog::backdrop { background: rgb(0 0 0 / 0.4); }
      dialog h2 { margin: 0; font-size: 20px; line-height: 26px; font-weight: 400; }
      .panel-head {

        align-items: center;
        gap: 12px;

      .panel-head form { margin: 0; }

        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);

         pointer in hand comes first. */

      #help h3 { margin: 0 0 8px; font-size: 16px; line-height: 24px; font-weight: 600; }
      @media (hover: none) {
        #help .help-touch { order: -1; }
      }
      dl.keys, dl.touch {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.375rem 1.25rem;
        margin: 0;
      }
      dl.keys dt { white-space: nowrap; }
      dl.keys dd, dl.touch dd { margin: 0; }
      @media (max-width: 30rem) {
        dl.keys, dl.touch { grid-template-columns: 1fr; row-gap: 0; }
        dl.keys dd, dl.touch dd { margin-block-end: 0.5rem; color: var(--note); }
        dl.keys dt { white-space: normal; }
      }
      kbd {
        font: 13px/18px var(--font-mono);
        padding: 0 4px;
        border: 1px solid var(--guide);
        border-radius: 4px;
        background: var(--code-bg);
        color: var(--fg);

      .empty, .status { color: var(--note); font-style: normal; }
      .status:empty { display: none; }

         visible behind them. With a mouse: Spacing sits fixed at the top right over the page
         margin and the menu drops from its button. Narrow or touch: both are bottom sheets. */

        margin: 0;
        z-index: 3;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 12px 16px 14px;
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        background: var(--panel-bg);
        color: var(--fg);
        box-shadow: 0 6px 24px var(--panel-shadow);

          border-radius: 12px 12px 0 0;

          padding-block-end: max(14px, env(safe-area-inset-bottom));

      #spacing h2 { margin: 0; font-size: 16px; line-height: 24px; }
      #spacing .panel-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      #spacing .knobs { display: grid; gap: 10px; margin-block: 10px 8px; }
      #spacing .knob {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: baseline;
        column-gap: 8px;
      }
      #spacing output { color: var(--note); font-variant-numeric: tabular-nums; }
      #spacing input[type="range"] {
        grid-column: 1 / -1;
        inline-size: 100%;
        block-size: var(--hit);
        margin: 0;
        accent-color: var(--link-focus);
      }
      #spacing .step { display: none; }
      /* In a sheet, each slider has − and + steps beside it (a thumb is hard to nudge by one). */
      @media (max-width: 40rem), (any-pointer: coarse) {
        #spacing .knob { grid-template-columns: auto 1fr auto; align-items: center; }
        #spacing .knob label { grid-column: 1 / 3; }

      @media (max-width: 40rem) {

      }
      #spacing .spacing-note { margin: 0; color: var(--label); font-size: 13px; text-align: end; }
      #spacing .spacing-ref { margin: 0 0 12px; color: var(--label); font-size: 13px; line-height: 18px; }
      #spacing .status { margin: 6px 0 0; min-block-size: 20px; }
      #spacing .status:empty { display: block; }      /* stays in the accessibility tree as a live region */

      /* The ⋯ menu: what the keyboard commands do, for the selected item (or the page). */
      .menu-target {
        margin: 0;
        padding: 6px 16px 8px;
        color: var(--note);
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-block-end: 1px solid var(--guide);
      }
      .menu { display: flex; flex-direction: column; padding-block: 4px; }
      .menu button {
        display: block;
        inline-size: 100%;
        min-block-size: var(--hit);
        padding: 6px 16px;
        text-align: start;
        font-size: 15px;
        color: var(--fg);
      }
      .menu button:disabled { color: var(--label); cursor: default; }
      .menu .level {
        display: flex;
        align-items: center;
        gap: 4px;
        padding-inline: 16px 8px;
        font-size: 15px;
      }
      .menu .level > span:first-child { flex: 1 1 auto; }
      .menu .level output { min-inline-size: 1.5em; text-align: center; font-variant-numeric: tabular-nums; }
      .menu .level button { inline-size: auto; min-inline-size: var(--hit); padding: 0; text-align: center; font-size: 20px; }
      .menu hr { inline-size: 100%; margin: 4px 0; border: 0; border-block-start: 1px solid var(--guide); }
      @media (any-pointer: coarse) {
        .menu-target, .menu button { padding-inline: 20px; }
        .menu .level { padding-inline: 20px 12px; }
      }

      /* Copy link's toast: non-modal, outside the tree, never focusable or clickable. */
      .toast {
        position: fixed;
        inset-block-end: max(24px, calc(env(safe-area-inset-bottom) + 12px));
        inset-inline-start: 50%;
        z-index: 4;
        translate: -50% 0;
        margin: 0;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 15px;
        background: var(--fg);
        color: var(--bg);
        pointer-events: none;
      }
      @media (forced-colors: active) {
        .toast { border: 1px solid CanvasText; }
      }
    }

    @layer states {
      [hidden] { display: none !important; }
      [role="treeitem"]:focus { outline: none; }
      /* The highlight follows the state (law D), not focus: selected rows, none in idle mode. */
      [role="treeitem"][aria-selected="true"] > .row { background: var(--active); }
      /* A range selects whole subtrees: fill the item's box, indent and guides included, so the
         subtree reads as one block. A single selection leaves its children unselected, so only
         its row is filled. */
      [role="treeitem"][aria-selected="true"]:has(> [role="group"] > [aria-selected="true"]) { background: var(--active); }
      /* Dynalist draws no guides inside a range's fill. */

        border-inline-start-color: transparent;
      }
      [role="treeitem"][aria-selected="true"] > .row .label { color: var(--note); }   /* --label is 4.2:1 on --active */
      /* In selected mode the ring marks the active item whenever focus is in the tree, however it
         got there; law D keeps focus in the tree on the active item. Idle mode shows no ring. */

        outline: 2px solid var(--link-focus);
        outline-offset: -2px;
      }
      [aria-expanded] > .row > .toggle { cursor: pointer; }
      @media (forced-colors: active) {
        [role="treeitem"][aria-selected="true"] > .row {
          background: none;
          outline: 1px solid Highlight;
        }
        [role="treeitem"][aria-selected="true"] { background: none; }
        .toggle::before { background: CanvasText; forced-color-adjust: none; }
        [aria-expanded="false"] > .row > .toggle::after {
          box-shadow: inset 0 0 0 1.5px CanvasText;

        }
        @media (hover: hover) {
          [aria-expanded="false"] > .row:hover > .toggle::after { box-shadow: none; background: CanvasText; }
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; }
      }
    }

  <script type="application/json" id="outline-source">"# Outline\n\n- 1 Replace this outline with your content.\n  - 1.1 Each list item is one proposition; indentation sets its parent.\n  - 1.2 A leading number like 1.2 is shown as the item's label."</script>

  <script type="module">
    // ── parse ────────────────────────────────────────────
    /** @typedef {{ id: string, label: string|null, text: string, children: OutlineNode[] }} OutlineNode */
    /** @typedef {{ title: string|null, intro: string[], items: OutlineNode[], warnings: string[] }} OutlineDocument */

    // The `s` flag lets `.` match U+2028/U+2029, which JS treats as line terminators but
    // markdown does not; lines are split on "\n" only.
    const ITEM_RE = /^( *)([-*+]|\d+[.)])(?:( +)(.*))?$/s;
    const TITLE_RE = /^#\s+(.+)$/s;
    const LABEL_RE = /^(\d+(?:\.\d+)*)(?:\s+(.*))?$/s;
    const TAB_STOP = 4;

    /** Expand tabs to spaces at tab stops of 4 columns (one column per code point). */
    function expandTabs(line) {
      if (!line.includes("\t")) return line;
      let out = "";
      let col = 0;
      for (const ch of line) {
        if (ch === "\t") {
          const n = TAB_STOP - (col % TAB_STOP);
          out += " ".repeat(n);
          col += n;
        } else {
          out += ch;
          col += 1;
        }
      }
      return out;
    }

    const leadingSpaces = (line) => line.length - line.replace(/^ +/, "").length;
    const appendLine = (para, line) => (para === "" ? line : `${para} ${line}`);
    const joinParas = (paras) => paras.filter((p) => p !== "").join("\n\n");

    /** Total: every string parses to an outline (law P). Pure; no DOM access. */
    function parseOutline(markdown) {
      /** @type {OutlineDocument} */
      const doc = { title: null, intro: [], items: [], warnings: [] };
      const lines = String(markdown).replace(/\r\n?/g, "\n").split("\n");
      const stack = [];      // { indent, contentCol, node }
      const entries = [];    // { node, paras } for every item, in document order
      let current = null;    // the most recent item's entry
      let introPara = null;  // lines of the intro paragraph being built
      let seenNonBlank = false;
      let blankSeen = false;

      const flushIntro = () => {
        if (introPara !== null) doc.intro.push(introPara.join(" "));
        introPara = null;
      };

      lines.forEach((raw, i) => {
        const line = expandTabs(raw).replace(/[ \t\f\v]+$/, "");

        if (line === "") {
          blankSeen = true;
          if (current === null) flushIntro();
          return;
        }

        const m = ITEM_RE.exec(line);
        if (m !== null) {
          if (current === null) flushIntro();
          const indent = m[1].length;
          const marker = m[2];
          const spaces = m[3] ?? "";
          let text = m[4] ?? "";
          const contentCol = indent + marker.length + Math.max(1, spaces.length);
          while (stack.length > 0 && stack[stack.length - 1].indent >= indent) stack.pop();

          let label = null;
          if (/^\\\d/.test(text)) {
            text = text.slice(1);
          } else {
            const l = LABEL_RE.exec(text);
            if (l !== null) {
              label = l[1];
              text = l[2] ?? "";
            }
          }

          /** @type {OutlineNode} */
          const node = { id: "", label, text: "", children: [] };
          const siblings = stack.length > 0 ? stack[stack.length - 1].node.children : doc.items;
          siblings.push(node);
          const entry = { indent, contentCol, node, paras: [text] };
          stack.push(entry);
          entries.push(entry);
          current = entry;
          seenNonBlank = true;
          blankSeen = false;
          return;
        }

        if (current === null) {
          // Preamble: optional title, then intro paragraphs.
          if (!seenNonBlank) {
            seenNonBlank = true;
            const t = TITLE_RE.exec(line);
            if (t !== null) {
              doc.title = t[1];
              blankSeen = false;
              return;
            }
          }
          if (introPara === null) introPara = [];
          introPara.push(line.slice(leadingSpaces(line)));
          blankSeen = false;
          return;
        }

        // Continuation of the most recent item.
        const indent = leadingSpaces(line);
        const text = line.slice(indent);
        if (!blankSeen) {
          const last = current.paras.length - 1;
          current.paras[last] = appendLine(current.paras[last], text);
        } else {
          if (indent < current.contentCol) {
            doc.warnings.push(`line ${i + 1}: paragraph after blank line is not indented under its item`);
          }
          current.paras.push(text);
        }
        blankSeen = false;
      });
      flushIntro();

      for (const { node, paras } of entries) node.text = joinParas(paras);

      // Ids: a label that occurs once is the id; everything else is positional.
      const counts = new Map();
      for (const { node } of entries) {
        if (node.label !== null) counts.set(node.label, (counts.get(node.label) ?? 0) + 1);
      }
      for (const [label, n] of counts) {
        if (n > 1) doc.warnings.push(`duplicate label "${label}"; using positional ids`);
      }
      const assign = (nodes, path) => {
        nodes.forEach((node, k) => {
          const p = [...path, k + 1];
          node.id = node.label !== null && counts.get(node.label) === 1 ? node.label : `p-${p.join("-")}`;
          assign(node.children, p);
        });
      };
      assign(doc.items, []);
      return doc;

    // ── inline ───────────────────────────────────────────
    /** @typedef {
     *   {type:"text", value:string} | {type:"code", value:string} | {type:"math", tex:string} |
     *   {type:"em"|"strong", children:InlineToken[]} | {type:"link", dest:string, children:InlineToken[]}
     * } InlineToken */
    const SYNTAX = "\\`*_$[]";   // exactly the characters escapeInline escapes; Phase 6 relies on this set

    const isSpace = (c) => c !== undefined && c <= " ";                    // any character up to U+0020
    const isPunct = (c) => c !== undefined && /^[!-/:-@[-`{-~]$/.test(c);  // ASCII punctuation
    const isAlnum = (c) => c !== undefined && /^[\p{L}\p{N}]$/u.test(c);
    const isDigit = (c) => c !== undefined && c >= "0" && c <= "9";
    const runLength = (s, i, c) => {
      let j = i;
      while (s[j] === c) j += 1;
      return j - i;
    };

    // Rules 1–3 are also the "atoms" that the closer searches of rules 5 and 6 skip over.
    // Each returns { token, end } or null; `end` is the index just past what was consumed.

    /** Rule 1: `\` + ASCII punctuation is that character as text. */
    function ruleEscape(s, i) {
      return s[i] === "\\" && isPunct(s[i + 1]) ? { token: { type: "text", value: s[i + 1] }, end: i + 2 } : null;
    }

    /** Rule 2: a backtick run opens code that closes at the next run of exactly the same length. */
    function ruleCode(s, i) {
      if (s[i] !== "`") return null;
      const n = runLength(s, i, "`");
      for (let j = s.indexOf("`", i + n); j !== -1; ) {
        const m = runLength(s, j, "`");
        if (m === n) {
          let value = s.slice(i + n, j);
          if (value.length >= 2 && value[0] === " " && value.at(-1) === " " && value.trim() !== "") {
            value = value.slice(1, -1);
          }
          return { token: { type: "code", value }, end: j + n };
        }
        j = s.indexOf("`", j + m);
      }
      return { token: { type: "text", value: s.slice(i, i + n) }, end: i + n };
    }

    /** Rule 3: `$…$` math; a run of two or more `$` is literal text. */
    function ruleDollar(s, i) {
      if (s[i] !== "$") return null;
      const run = runLength(s, i, "$");
      if (run >= 2) return { token: { type: "text", value: s.slice(i, i + run) }, end: i + run };
      if (s[i + 1] === undefined || isSpace(s[i + 1])) return { token: { type: "text", value: "$" }, end: i + 1 };
      // Skipping `\x` pairs means a `$` is a closer only after an even number of backslashes.
      for (let k = i + 1; k < s.length; ) {
        if (s[k] === "\\") { k += 2; continue; }
        if (s[k] !== "$") { k += 1; continue; }
        const m = runLength(s, k, "$");
        if (m === 1 && k >= i + 2 && !isSpace(s[k - 1]) && !isDigit(s[k + 1])) {
          return { token: { type: "math", tex: s.slice(i + 1, k) }, end: k + 1 };
        }
        k += m;
      }
      return { token: { type: "text", value: "$" }, end: i + 1 };
    }

    /** Rule 4: `[label](dest)`; any failure means the rule does not match. */
    function ruleLink(s, i) {
      if (s[i] !== "[") return null;
      let depth = 0;
      let j = i + 1;
      for (; j < s.length; j += 1) {
        if (s[j] === "\\" && isPunct(s[j + 1])) { j += 1; continue; }
        if (s[j] === "[") depth += 1;
        else if (s[j] === "]") {
          if (depth === 0) break;
          depth -= 1;
        }
      }
      if (j >= s.length || j === i + 1 || s[j + 1] !== "(") return null;
      const label = s.slice(i + 1, j);
      let dest = "";
      depth = 0;
      for (let k = j + 2; k < s.length; k += 1) {
        const c = s[k];
        if (isSpace(c)) return null;
        if (c === "\\" && isPunct(s[k + 1])) { dest += s[k + 1]; k += 1; continue; }
        if (c === ")") {
          if (depth === 0) {
            return { token: { type: "link", dest, children: parseInline(label, { links: false }) }, end: k + 1 };
          }
          depth -= 1;
        } else if (c === "(") depth += 1;
        dest += c;
      }
      return null;
    }

    /** Index of the first closer at or after `from` that `isCloser` accepts, skipping rules 1–3; or -1. */
    function findCloser(s, from, isCloser) {
      for (let k = from; k < s.length; ) {
        const atom = ruleEscape(s, k) ?? ruleCode(s, k) ?? ruleDollar(s, k);
        if (atom !== null) { k = atom.end; continue; }
        if (isCloser(k)) return k;
        k += 1;
      }
      return -1;
    }

    /** Rule 5: `**strong**`. */
    function ruleStrong(s, i, options) {
      if (s[i] !== "*" || s[i + 1] !== "*" || s[i + 2] === undefined || isSpace(s[i + 2])) return null;
      const k = findCloser(s, i + 2, (k) => k >= i + 3 && s[k] === "*" && s[k + 1] === "*" && !isSpace(s[k - 1]));
      if (k === -1) return null;
      return { token: { type: "strong", children: parseInline(s.slice(i + 2, k), options) }, end: k + 2 };

        tabbing = true;

      }, true);
      outline.addEventListener("focusin", (e) => {
        if (e.target.getAttribute("role") !== "treeitem") return;
        const id = e.target.dataset.id;
        if (id !== state.activeId) dispatch({ activeId: id }, { focus: false });
        else if (tabbing && state.mode === "idle") dispatch({ mode: "selected" }, { focus: false });
      });
    }

    const isPageRoot = (el) => el === null || el === document.body || el === document.documentElement;

    /** Focus the active item without scrolling; the mode is unchanged. */
    function focusActive() {
      if (state.activeId !== null) view.items.get(state.activeId).focus({ preventScroll: true });
    }

    /** No "no focus" state: a press on a non-interactive part of the page (margins, the
     *  header around its buttons, the empty-outline note) leaves focus on <body>, so return it
     *  to the active item. This runs on mouseup, after any drag: focus() does not collapse a
     *  text selection, so text dragged out of the title, the intro or a row stays selected for the native copy. Presses
     *  that start in a dialog or the Spacing panel are theirs. */
    function bindFocusKeeping() {
      let pressed = null;
      document.addEventListener("mousedown", (e) => { pressed = e.target; }, true);
      document.addEventListener("mouseup", () => {
        const from = pressed;
        pressed = null;
        if (from instanceof Element && from.closest("dialog")) return;
        if (document.querySelector("dialog:modal") !== null) return;
        if (isPageRoot(document.activeElement)) focusActive();
      });
    }

    /** Once at startup: the document's plain title, the empty note, and the page at the root. */
    function renderDocument(model) {
      const { doc } = model;
      DOC_TITLE = plainText(parseInline(doc.title ?? "Outline", { links: false }));
      document.querySelector(".empty").hidden = doc.items.length > 0;
      renderHead(model, ROOT);
      renderTree(model, ROOT);
    }

    /** The displayed root's row and the page title. At the root: the document title (no links)
     *  and intro. Zoomed: the item's label and first paragraph as the title, its other paragraphs
     *  as the intro; it is item text, so its links stay live and, like every tree link, are no Tab
     *  stops. */
    function renderHead(model, zoomId) {
      const title = document.getElementById("doc-title");
      let paras;
      if (zoomId === ROOT) {
        title.replaceChildren(renderInline(parseInline(model.doc.title ?? "Outline", { links: false }), model.byId));
        paras = model.doc.intro;
        document.title = DOC_TITLE;
      } else {
        const { node } = model.byId.get(zoomId);
        const [first = "", ...notes] = node.text === "" ? [] : node.text.split("\n\n");
        const tokens = parseInline(first);
        title.replaceChildren(...(node.label === null ? [] : [`${node.label} `]), renderInline(tokens, model.byId, { inTree: true }));
        paras = notes;
        const plain = [node.label, plainText(tokens)].filter((t) => t !== null && t !== "").join(" ");
        document.title = plain === "" ? DOC_TITLE : `${plain} – ${DOC_TITLE}`;
      }
      const intro = document.getElementById("intro");
      intro.replaceChildren(...paras.map((p) => {
        const para = h("p");
        para.append(renderInline(parseInline(p), model.byId, { inTree: true }));   // the displayed root's note
        return para;
      }));
      intro.hidden = paras.length === 0;
      const root = document.getElementById("item-root");
      if (paras.length > 0) root.setAttribute("aria-describedby", "intro");
      else root.removeAttribute("aria-describedby");
    }

    // ── commands ─────────────────────────────────────────
    /** @typedef {{ expanded?: Iterable<string>, activeId?: string }} Proposal */

    /** Proposal for moving `by` steps through the visible items; null at the ends. */
    function step(model, state, by) {
      const ids = visibleIds(model, state);
      const target = ids[ids.indexOf(state.activeId) + by];
      return target === undefined ? null : { activeId: target };
    }

    /** Shift+↑/↓: move the focus end one sibling; past the first or last sibling, the range
     *  becomes the parent (which holds them all) and later steps run among its siblings. */
    function extend(model, state, by) {
      if (state.activeId === state.zoomId) return null;   // the displayed root's siblings are outside
      const sibs = siblingsOf(model, state.activeId);
      const target = sibs[sibs.findIndex((n) => n.id === state.activeId) + by];
      if (target !== undefined) return { activeId: target.id, anchorId: state.anchorId };
      const parent = parentOf(model, state.activeId);
      return parent === null ? null : { activeId: parent, anchorId: parent };
    }

    function extendToEnd(model, state, end) {
      if (state.activeId === state.zoomId) return null;
      const sibs = siblingsOf(model, state.activeId);
      const target = end < 0 ? sibs[0] : sibs[sibs.length - 1];
      return target === undefined || target.id === state.activeId ? null : { activeId: target.id, anchorId: state.anchorId };
    }

    /** Shift+click: a range from the anchor to `id`, at the deepest level holding both; when one
     *  contains the other, the container alone. */
    function selectTo(model, state, id) {
      const from = [state.anchorId, ...ancestorsOf(model, state.anchorId)];
      const to = [id, ...ancestorsOf(model, id)];
      if (from.includes(id)) return { activeId: id };
      if (to.includes(state.anchorId)) return { activeId: state.anchorId };
      for (const a of from) {
        const t = to.find((x) => parentOf(model, x) === parentOf(model, a));
        if (t !== undefined) return { activeId: t, anchorId: a };
      }
      return { activeId: id };
    }

    /** Whether any child of the displayed root is expanded: its stand-in for its own expansion. */
    const topLevelOpen = (model, state) => childrenOf(model, state.zoomId).some((n) => state.expanded.has(n.id));

    /** ⌥⌘↑/↓: the nearest sibling in that direction; while filtering, the nearest shown one. */
    function stepSibling(model, state, by) {
      if (state.activeId === state.zoomId) return null;
      const sibs = siblingsOf(model, state.activeId);
      for (let i = sibs.findIndex((n) => n.id === state.activeId) + by; i >= 0 && i < sibs.length; i += by) {
        if (state.filter === null || state.filter.shown.has(sibs[i].id)) return { activeId: sibs[i].id };
      }
      return null;
    }

    /** Expansion and range commands do nothing while a query filters: openness is derived from
     *  the matches, and a change to `expanded` would surface only when the filter clears. */
    const unfiltered = (command) => (model, state, arg) => (state.filter !== null ? null : command(model, state, arg));

    /** Pure `(model, state, arg) => Proposal | null`; `arg` is the matched chord's, if any.
     *  Commands never touch the DOM or keep laws. */
    const COMMANDS = {
      next: (model, state) => step(model, state, 1),
      prev: (model, state) => step(model, state, -1),
      first: (model, state) => {
        const ids = visibleIds(model, state);
        return ids.length === 0 ? null : { activeId: ids[0] };
      },
      last: (model, state) => {
        const ids = visibleIds(model, state);
        return ids.length === 0 ? null : { activeId: ids[ids.length - 1] };
      },
      right: (model, state) => {
        const { expanded, activeId } = state;
        if (activeId === null || !hasChildren(model, activeId)) return null;
        if (state.filter !== null) {
          // While filtering: the first shown child, or nothing.
          const child = childrenOf(model, activeId).find((n) => state.filter.shown.has(n.id));
          return child === undefined ? null : { activeId: child.id };
        }
        if (!isOpen(state, activeId)) return { expanded: [...expanded.ids, activeId] };
        return { activeId: childrenOf(model, activeId)[0].id };
      },
      left: (model, { expanded, activeId, zoomId, filter }) => {
        if (activeId === null || activeId === zoomId) return null;   // the displayed root never collapses
        if (filter === null && expanded.has(activeId)) return { expanded: expanded.ids.filter((id) => id !== activeId) };
        const parent = parentOf(model, activeId);
        return parent === null ? null : { activeId: parent };
      },
      toggle: unfiltered((model, state) => {
        const { expanded, activeId } = state;
        if (activeId === null || !hasChildren(model, activeId)) return null;
        if (activeId === state.zoomId) {
          // The displayed root stays open; its children open or close one level instead.
          const parents = childrenOf(model, activeId).filter((n) => n.children.length > 0).map((n) => n.id);
          if (parents.length === 0) return null;
          if (topLevelOpen(model, state)) return { expanded: expanded.ids.filter((id) => !parents.includes(id)) };
          return { expanded: [...expanded.ids, ...parents] };
        }
        return { expanded: flip(expanded, activeId) };
      }),
      toggleSubtree: unfiltered((model, state) => {
        const { expanded, activeId } = state;
        if (activeId === null || !hasChildren(model, activeId)) return null;
        // The displayed root counts as expanded while any of its children is: then everything
        // below it closes. Its own entry (a zoomed item's expansion in the document) is kept.
        const onRoot = activeId === state.zoomId;
        const subtree = new Set([...(onRoot ? [] : [activeId]), ...descendantIds(model, activeId)]);
        const open = onRoot ? topLevelOpen(model, state) : expanded.has(activeId);
        if (open) return { expanded: expanded.ids.filter((id) => !subtree.has(id)) };
        return { expanded: [...expanded.ids, ...subtree] };
      }),
      expandSiblings: unfiltered((model, { expanded, activeId, zoomId }) => {
        if (activeId === null) return null;
        // The displayed root has no siblings on the page: on it, its children expand.
        const ids = activeId === zoomId ? childrenOf(model, zoomId) : siblingsOf(model, activeId);
        return { expanded: [...expanded.ids, ...ids.map((n) => n.id)] };
      }),
      prevSibling: (model, state) => stepSibling(model, state, -1),
      nextSibling: (model, state) => stepSibling(model, state, 1),
      extendUp: unfiltered((model, state) => extend(model, state, -1)),
      extendDown: unfiltered((model, state) => extend(model, state, 1)),
      extendFirst: unfiltered((model, state) => extendToEnd(model, state, -1)),
      extendLast: unfiltered((model, state) => extendToEnd(model, state, 1)),
      // The filter clears first, then a range collapses, then the selection goes idle.
      escape: (model, state) => (state.filter !== null ? { query: "" } : isRange(state) ? {} : { mode: "idle" }),
      /** Enter while filtering: keep the selected item, shown in place, and clear the filter. */
      accept: (model, state) =>
        state.filter === null || state.activeId === null ? null : { ...reveal(model, state, state.activeId), query: "" },
      /** Dynalist's "expand to level": below the active item, items fewer than n levels down are
       *  expanded and deeper ones collapsed; outside its subtree nothing changes. The displayed
       *  root is always open, so only its descendants change. */
      expandLevel: unfiltered((model, state, n) => {
        const { expanded, activeId } = state;
        if (activeId === null || !hasChildren(model, activeId) || !(n >= 1 && n <= 9)) return null;
        const below = new Set(descendantIds(model, activeId));
        const open = activeId === state.zoomId ? [] : [activeId];
        const walk = (nodes, depth) => {
          if (depth >= n) return;
          for (const node of nodes) {
            if (node.children.length === 0) continue;
            open.push(node.id);
            walk(node.children, depth + 1);
          }
        };
        walk(childrenOf(model, activeId), 1);
        return { expanded: [...expanded.ids.filter((id) => !below.has(id)), ...open] };
      }),
    };

    // ── keymap ───────────────────────────────────────────
    // userAgentData.platform is "macOS" (lowercase m), navigator.platform is "MacIntel": match case-insensitively.
    const IS_APPLE = /mac|iphone|ipad/i.test(navigator.userAgentData?.platform ?? navigator.platform);

    /** The single source of truth for key bindings and the help dialog.
     *  chord fields: key (KeyboardEvent.key) or code (KeyboardEvent.code);
     *  mod/alt/shift: true | false (default false) | "any"; arg: passed to the command.
     *  label: shown in help as one key instead of every chord. */
    const MULTI = "Touch selects one item at a time: a range needs a keyboard (Shift) or a mouse (Shift+click)";
    /** The single source of truth for key bindings, touch gestures, the ⋯ menu and the help dialog.
     *  chord fields: key (KeyboardEvent.key) or code (KeyboardEvent.code);
     *  mod/alt/shift: true | false (default false) | "any"; arg: passed to the command.
     *  label: shown in help as one key instead of every chord.
     *  touch: the gesture that does it on a touch screen, or false with a `reason` (multi-select
     *  only); touchHelp: its help text when it differs from `help`.
     *  menu: its item in the ⋯ menu (the name in help); menuLabel: (state, target) => the item's
     *  text for the menu's target, when it depends on it. */
    const KEYMAP = [
      { command: "prev",           chords: [{ key: "ArrowUp" }],                 help: "Previous item",
        touch: "Tap an item", touchHelp: "Select it" },
      { command: "next",           chords: [{ key: "ArrowDown" }],               help: "Next item", touch: "Tap an item" },
      { command: "right",          chords: [{ key: "ArrowRight" }],              help: "Expand, or go to first child",
        touch: "Tap a bullet", touchHelp: "Select its item and expand or collapse it" },
      { command: "left",           chords: [{ key: "ArrowLeft" }],               help: "Collapse, or go to parent", touch: "Tap a bullet" },
      { command: "first",          chords: [{ key: "Home" }],                    help: "First item: the title",
        touch: "Tap the title", touchHelp: "Select the title: ⋯ then acts on the whole page" },
      { command: "last",           chords: [{ key: "End" }],                     help: "Last item", touch: "Tap an item" },
      { command: "expandSiblings", chords: [{ key: "*", shift: "any" }],         help: "Expand all siblings; on the title, the top level",
        menu: "Expand siblings" },
      { command: "toggle",         chords: [{ code: "Period", mod: true }],      help: "Expand/collapse; on the title, the top level",
        touch: "Tap a bullet", menu: "Expand/Collapse",
        menuLabel: (s, t) => (t === s.zoomId ? (topLevelOpen(model, s) ? "Collapse top level" : "Expand top level") : isOpen(s, t) ? "Collapse" : "Expand") },
      { command: "toggleSubtree",  chords: [{ code: "Period", mod: true, shift: true }], help: "Expand/collapse all descendants; on the title, the whole outline",
        menu: "Expand all/Collapse all",
        menuLabel: (s, t) => ((t === s.zoomId ? topLevelOpen(model, s) : s.expanded.has(t)) ? "Collapse all" : "Expand all") },
      { command: "prevSibling",    chords: [{ key: "ArrowUp", mod: true, alt: true }],   help: "Previous sibling", touch: "Tap an item" },
      { command: "nextSibling",    chords: [{ key: "ArrowDown", mod: true, alt: true }], help: "Next sibling", touch: "Tap an item" },
      { command: "extendUp",       chords: [{ key: "ArrowUp", shift: true }],    help: "Select the previous item too; past the first, its parent", extends: true,
        touch: false, reason: MULTI },
      { command: "extendDown",     chords: [{ key: "ArrowDown", shift: true }],  help: "Select the next item too; past the last, its parent", extends: true,
        touch: false, reason: MULTI },
      { command: "extendFirst",    chords: [{ key: "Home", shift: true }],       help: "Select to the first sibling", extends: true,
        touch: false, reason: MULTI },
      { command: "extendLast",     chords: [{ key: "End", shift: true }],        help: "Select to the last sibling", extends: true,
        touch: false, reason: MULTI },
      { command: "selectTo",       chords: [{ key: "Click", shift: true }],      help: "Select from the selected item to here", passive: true,
        touch: false, reason: MULTI },
      { command: "copy",           chords: [{ key: "c", mod: true }],            help: "Copy the selected items as a markdown list; the title copies the whole document", passive: true,
        menu: "Copy as markdown" },
      { command: "escape",         chords: [{ key: "Escape" }],                  help: "Clear the filter, then the selection; any arrow key selects again",
        menu: "Clear find/Clear selection", menuLabel: (s) => (s.filter !== null ? "Clear find" : "Clear selection") },
      // ⇧⌘3–5 are macOS screenshots and ⌘1–9 switch tabs; ⌥ changes e.key on macOS (⌥1 is ¡), so match e.code.
      { command: "expandLevel",
        chords: [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({ code: `Digit${n}`, mod: true, alt: true, arg: n })),
        label: IS_APPLE ? "⌥⌘1–9" : "Ctrl+Alt+1–9",
        help: "Expand to that many levels below the selected item; on the title, the whole outline",
        menu: "Expand to level", touchHelp: "− and + expand one level less or more below the selected item" },
      // Effect entries run EFFECTS[command] instead of a pure command. ⇧⌘C also opens the
      // DevTools element picker; the page's preventDefault wins where tree keys are routed.
      { command: "copyLink",
        chords: [{ key: "c", mod: true, shift: true }, { key: "C", mod: true, shift: true }],
        label: IS_APPLE ? "⇧⌘C" : "Ctrl+Shift+C",
        help: "Copy a link to the selected item; the title links to the whole document", effect: true, menu: "Copy link" },
      // Touch only: the system share sheet, where the browser has one.
      { command: "share",          chords: [],                                   help: "Share a link to the selected item", menu: "Share…" },
      // ⌘[ and ⌘] are Back/Forward in macOS browsers but not reserved: bound only where tree keys are.
      { command: "zoomIn",         chords: [{ code: "BracketRight", mod: true }], help: "Zoom in: show the selected item as the page", effect: true,
        menu: "Zoom in" },
      { command: "zoomOut",        chords: [{ code: "BracketLeft", mod: true }],  help: "Zoom out one level", effect: true,
        touch: "Up, a crumb, Back, or ⋯ › Zoom out", menu: "Zoom out" },
      { command: "zoomClick",      chords: [{ key: "Click", mod: true }],        help: "On a bullet: zoom in", passive: true,
        touch: "⋯ › Zoom in", touchHelp: "Zoom in: show the selected item as the page" },
      { command: "linkClick",      chords: [{ key: "Click" }],                   help: "On a link to an item: zoom into it", passive: true,
        touch: "Tap a link to an item", touchHelp: "Zoom into it" },
      // global: handled by bindFind wherever it applies, never as a tree key. In the box itself
      // the browser's own find opens.
      { command: "find",           chords: [{ key: "f", mod: true }, { key: "F", mod: true }], label: IS_APPLE ? "⌘F" : "Ctrl+F",
        help: "Find: filter the outline; in the box, press again for the browser's find", global: true,
        touch: "Tap Find", touchHelp: "Filter the outline; ⋯ › Clear find shows it all again" },
      // treeOnly: the document router skips it, so Enter on a header button stays the button's.
      { command: "accept",         chords: [{ key: "Enter" }],                   help: "While finding: keep the selected item and clear the filter", treeOnly: true,
        menu: "Show in outline" },
      { command: "help",           chords: [{ key: "?", shift: "any" }],         help: "Show this help", menu: "Help", touch: "Tap Help" },
    ];
    /** The gesture a KEYMAP entry lists in the touch help, or null. */
    const touchGesture = (e) => (typeof e.touch === "string" ? e.touch : e.menu !== undefined ? `⋯ › ${e.menu}` : null);

    function chordMatches(chord, e) {
      if (chord.key !== undefined && chord.key !== e.key) return false;
      if (chord.code !== undefined && chord.code !== e.code) return false;
      const mod = IS_APPLE ? e.metaKey : e.ctrlKey;
      const other = IS_APPLE ? e.ctrlKey : e.metaKey;
      if (other) return false;
      // Off Apple, Ctrl+Alt is AltGr on many layouts: a character, not a chord. On macOS, Option
      // itself can report AltGraph, so the guard would disable every ⌥ chord there.
      if (chord.alt === true && !IS_APPLE && e.getModifierState?.("AltGraph")) return false;
      const want = { mod, alt: e.altKey, shift: e.shiftKey };
      return Object.entries(want).every(([k, v]) => (chord[k] ?? false) === "any" || (chord[k] ?? false) === v);
    }

    /** The KEYMAP entry an event matches and the matching chord, or undefined. */
    function matchFor(e) {
      for (const entry of KEYMAP) {
        const chord = entry.chords.find((c) => chordMatches(c, e));
        if (chord !== undefined) return { entry, chord };
      }
      return undefined;
    }
    const entryFor = (e) => matchFor(e)?.entry;

    const DIGIT_NAMES = Object.fromEntries([1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => [`Digit${n}`, String(n)]));
    const KEY_NAMES = {
      ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→", Period: ".", Escape: "Esc", Click: "click", c: "C",
      BracketRight: "]", BracketLeft: "[",
      ...DIGIT_NAMES,
    };

    function chordLabel(chord) {
      const key = KEY_NAMES[chord.key ?? chord.code] ?? chord.key ?? chord.code;
      if (IS_APPLE) {
        // macOS order: Option, Shift, Command.
        return (chord.alt === true ? "⌥" : "") + (chord.shift === true ? "⇧" : "") + (chord.mod === true ? "⌘" : "") + key;
      }
      const parts = [];
      if (chord.mod === true) parts.push("Ctrl");
      if (chord.alt === true) parts.push("Alt");
      if (chord.shift === true) parts.push("Shift");
      return [...parts, key].join("+");
    }

    function renderHelp() {
      const dl = document.querySelector("#help .keys");
      dl.replaceChildren();
      for (const { chords, label, help } of KEYMAP) {
        if (chords.length === 0) continue;
        const dt = h("dt");
        if (label !== undefined) dt.append(h("kbd", "", label));
        else chords.forEach((c, i) => {
          if (i > 0) dt.append(" or ");
          dt.append(h("kbd", "", chordLabel(c)));
        });
        dl.append(dt, h("dd", "", help));
      }
      const touch = document.querySelector("#help .touch");
      touch.replaceChildren();
      const seen = new Set();
      for (const e of KEYMAP) {
        const gesture = touchGesture(e);
        if (gesture === null || seen.has(gesture) || (e.command === "share" && !canShare())) continue;
        seen.add(gesture);
        touch.append(h("dt", "", gesture), h("dd", "", e.touchHelp ?? e.help));
      }
    }

    function showHelp() {
      const dialog = document.getElementById("help");
      if (!dialog.open) dialog.showModal();
    }

    const isEditable = (el) =>
      el instanceof Element && (el.isContentEditable || el.closest("input, textarea, select") !== null);

    /** The tree command an event names, as matchFor's { entry, chord }, or undefined: help,
     *  passive and global entries are not. */
    function treeMatchFor(e) {
      const match = matchFor(e);
      return match === undefined || match.entry.command === "help" || match.entry.passive || match.entry.global ? undefined : match;
    }

    function runTreeKey(e, { entry, chord }) {
      e.preventDefault();
      if (state.mode === "idle") {
        // The first key after Escape re-selects the remembered item, without moving.
        if (entry.command !== "escape") dispatch({ mode: "selected" }, { focus: true });
        return;
      }
      if (entry.effect) {
        EFFECTS[entry.command]();
        dispatch(isRange(state) ? {} : null, { focus: true });   // a range collapses, as for any non-extending key
        return;
      }
      const proposal = COMMANDS[entry.command](model, state, chord.arg);
      // Any key but an extending one collapses a range, even when its command does nothing.
      dispatch(proposal ?? (isRange(state) && !entry.extends ? {} : null), { focus: true });
    }

    function bindKeys(outline) {
      outline.addEventListener("keydown", (e) => {
        const match = treeMatchFor(e);
        if (match !== undefined) runTreeKey(e, match);
      });
      // A tree key pressed while focus is on <body> (a stray blur, a text drag outside the
      // tree) or on a header button (where a closed dialog returns focus) goes to the tree.
      // Tree-only keys (Enter) are not routed, and no other tree key is Enter, Space or Tab, so
      // the buttons keep their own keys. Focus in a dialog, the Spacing panel or a form control
      // (the find box) is on neither, so their keys are untouched.
      document.addEventListener("keydown", (e) => {
        const routed = isPageRoot(e.target) || (e.target instanceof Element && e.target.matches(".page-tools button"));
        if (!routed || state.activeId === null) return;
        const match = treeMatchFor(e);
        if (match === undefined || match.entry.treeOnly) return;
        focusActive();
        runTreeKey(e, match);
      });
    }

    /** The subtrees of `ids` as a markdown list that parseOutline reads back: labels, notes and
     *  inline source as written, nested relative to `ids`, collapsed children included. The root
     *  (only ever selected alone) is the whole document: title heading, intro, then the list. */
    function outlineMarkdown(model, ids) {
      if (ids.includes(ROOT)) {
        const { title, intro, items } = model.doc;
        const head = [...(title === null ? [] : [`# ${title}`]), ...intro].join("\n\n");
        const list = items.length === 0 ? "" : outlineMarkdown(model, items.map((n) => n.id));
        return head === "" ? list : list === "" ? `${head}\n` : `${head}\n\n${list}`;
      }

      const write = (node, depth) => {
        const pad = "  ".repeat(depth);
        const [first = "", ...notes] = node.text === "" ? [] : node.text.split("\n\n");
        const lead = node.label !== null ? `${node.label} ` : /^\d/.test(first) ? "\\" : "";

        for (const note of notes) lines.push("", `${pad}  ${note}`);

    /** Copy with no text selected copies the selected items; a mouse text selection copies as usual. */

    function bindHelp() {
      const dialog = document.getElementById("help");
      document.getElementById("help-button").addEventListener("click", showHelp);
      // A click on the backdrop (the dialog element itself, outside its box) closes it.
      dialog.addEventListener("click", (e) => {
        if (e.target !== dialog) return;
        const r = dialog.getBoundingClientRect();
        if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dialog.close();

        if (dialog.contains(e.target) || isEditable(e.target)) return;

      const input = document.getElementById("find-input");
      // Typing filters without selecting: an idle page stays idle (as Dynalist's search does).
      input.addEventListener("input", () => dispatch({ query: input.value, mode: state.mode }, { focus: false }));
      input.addEventListener("keydown", (e) => {

    // ── links ────────────────────────────────────────────

    // from storage. Selection, expansion, find and copy never touch `location` or `history`.

    /** @typedef {{kind:"none"} | {kind:"id", id:string} | {kind:"zoom", id:string} | {kind:"malformed", raw:string}} Fragment */
    function readFragment(hash = location.hash) {

    function linkTarget(dest, byId) {             // -> LinkTarget | null

    // ── zoom ─────────────────────────────────────────────

    const zoomOut = () => {
      const t = zoomOutTarget(model, state);

    /** Effect entries of KEYMAP: commands that act outside the state. */
    const EFFECTS = { copyLink: () => copyLink(), zoomIn, zoomOut };

    let lastApplied = null;

    function setZoom(z, { history: mode = "none", activeId = state.activeId, focus = true, select = "selected" } = {}) {

      const zoomId = model.byId.has(z) ? z : ROOT;

    // ── math ─────────────────────────────────────────────

    // panel when it is a bottom sheet (with a mouse it stays open beside the live outline).
    const SHEET_MQ = matchMedia("(max-width: 40rem), (any-pointer: coarse)");
